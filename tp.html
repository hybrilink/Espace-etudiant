    <script>

        // ================================================================
        // FIREBASE
        // ================================================================

        const firebaseConfig = {
            apiKey: "AIzaSyBb82N-5ns7qKjBAj5UvDW87s2PZ27F0",
            authDomain: "fsa-unilu.firebaseapp.com",
            projectId: "fsa-unilu",
            storageBucket: "fsa-unilu.firebasestorage.app",
            messagingSenderId: "36551990738",
            appId: "1:36551990738:web:e91fdcb53f8aab5d1b7c0b"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();


        // ================================================================
        // CHARGEMENT DE NOTIFICATION-UTILS.JS
        // ================================================================

        function loadNotificationUtils() {

            return new Promise((resolve) => {

                if (typeof window.notificationManager !== 'undefined') {
                    resolve(true);
                    return;
                }

                const existingScript =
                    document.querySelector(
                        'script[data-notification-utils="true"]'
                    );

                if (existingScript) {

                    if (
                        typeof window.notificationManager !==
                        'undefined'
                    ) {
                        resolve(true);
                        return;
                    }

                    existingScript.addEventListener(
                        'load',
                        () => resolve(true),
                        { once: true }
                    );

                    existingScript.addEventListener(
                        'error',
                        () => resolve(false),
                        { once: true }
                    );

                    return;
                }

                const script =
                    document.createElement('script');

                script.src = './notification-utils.js';

                script.async = false;

                script.dataset.notificationUtils = 'true';

                script.onload = () => {

                    console.log(
                        '✅ notification-utils.js chargé'
                    );

                    resolve(true);
                };

                script.onerror = () => {

                    console.warn(
                        '⚠️ Impossible de charger notification-utils.js'
                    );

                    resolve(false);
                };

                document.head.appendChild(script);
            });
        }


        // ================================================================
        // LISTE DES DÉPARTEMENTS
        // ================================================================

        const DEPARTEMENTS = [
            "Agronomie Générale",
            "Économie Agricole",
            "Sciences du Sol",
            "Protection des Végétaux",
            "Zootechnie",
            "Génie Rural"
        ];


        // ================================================================
        // SESSION
        // ================================================================

        let currentStudent = null;

        function checkSession() {

            const session =
                localStorage.getItem(
                    'session_etudiant'
                );

            if (!session) {

                window.location.href =
                    'login-etudiant.html';

                return false;
            }

            try {

                const data =
                    JSON.parse(session);

                if (
                    !data ||
                    !data.expires ||
                    Date.now() > data.expires
                ) {

                    localStorage.removeItem(
                        'session_etudiant'
                    );

                    window.location.href =
                        'login-etudiant.html';

                    return false;
                }

                if (!data.id) {

                    console.error(
                        'Session invalide : identifiant étudiant absent.'
                    );

                    localStorage.removeItem(
                        'session_etudiant'
                    );

                    window.location.href =
                        'login-etudiant.html';

                    return false;
                }

                currentStudent = data;

                return true;

            } catch (e) {

                console.error(
                    'Session invalide:',
                    e
                );

                localStorage.removeItem(
                    'session_etudiant'
                );

                window.location.href =
                    'login-etudiant.html';

                return false;
            }
        }


        // ================================================================
        // FONCTIONS UTILITAIRES
        // ================================================================

        function showLoading(
            show,
            message = 'Traitement en cours...'
        ) {

            const overlay =
                document.getElementById(
                    'loadingOverlay'
                );

            const text =
                document.getElementById(
                    'loadingText'
                );

            if (overlay) {

                overlay.style.display =
                    show ? 'flex' : 'none';
            }

            if (text) {

                text.textContent =
                    message;
            }
        }


        function escapeHtml(text) {

            if (
                text === null ||
                text === undefined
            ) {
                return '';
            }

            const div =
                document.createElement('div');

            div.textContent =
                String(text);

            return div.innerHTML;
        }


        function showToast(
            message,
            type = 'success'
        ) {

            const existing =
                document.querySelector(
                    '.toast-custom'
                );

            if (existing) {
                existing.remove();
            }

            const colors = {

                success: {
                    bg: '#28a745',
                    icon: 'check-circle-fill'
                },

                warning: {
                    bg: '#ffc107',
                    icon: 'exclamation-triangle-fill',
                    textColor: '#333'
                },

                danger: {
                    bg: '#dc3545',
                    icon: 'x-circle-fill'
                },

                info: {
                    bg: '#17a2b8',
                    icon: 'info-circle-fill'
                }
            };

            const config =
                colors[type] ||
                colors.success;

            const textColor =
                config.textColor ||
                'white';

            const toastHtml = `
                <div class="toast-custom"
                     style="
                        position:fixed;
                        top:20px;
                        right:20px;
                        z-index:10000;
                        background:${config.bg};
                        color:${textColor};
                        padding:15px 20px;
                        border-radius:12px;
                        box-shadow:0 5px 20px rgba(0,0,0,0.2);
                        animation:slideInRight 0.3s ease-out;
                        max-width:350px;
                        font-weight:500;
                     ">

                    <i class="bi bi-${config.icon} me-2"></i>
                    ${message}

                </div>
            `;

            document.body.insertAdjacentHTML(
                'beforeend',
                toastHtml
            );

            setTimeout(() => {

                const t =
                    document.querySelector(
                        '.toast-custom'
                    );

                if (t) {
                    t.remove();
                }

            }, 4000);
        }


        function getDepartementName(
            deptValue
        ) {

            if (
                DEPARTEMENTS.includes(
                    deptValue
                )
            ) {
                return deptValue;
            }

            return deptValue ||
                'Non défini';
        }


        // ================================================================
        // DONNÉES
        // ================================================================

        let studentProject = null;

        let directorInfo = null;

        let allPromotions = [];


        // ================================================================
        // CHARGER LE PROJET DE L'ÉTUDIANT
        // ================================================================

        async function loadStudentProject() {

            try {

                const snapshot =
                    await db.collection('projets')
                        .where(
                            'etudiantId',
                            '==',
                            currentStudent.id
                        )
                        .limit(1)
                        .get();

                if (!snapshot.empty) {

                    studentProject = {
                        id: snapshot.docs[0].id,
                        ...snapshot.docs[0].data()
                    };

                } else {

                    studentProject = null;
                }

                return studentProject;

            } catch (error) {

                console.error(
                    'Erreur chargement projet:',
                    error
                );

                return null;
            }
        }


        // ================================================================
        // CHARGER LE DIRECTEUR
        // ================================================================

        async function loadDirectorInfo(
            directorId
        ) {

            if (!directorId) {

                directorInfo = null;

                return null;
            }

            try {

                const doc =
                    await db.collection(
                        'utilisateurs'
                    )
                    .doc(directorId)
                    .get();

                if (doc.exists) {

                    directorInfo = {
                        id: doc.id,
                        ...doc.data()
                    };

                    return directorInfo;
                }

                directorInfo = null;

                return null;

            } catch (error) {

                console.error(
                    'Erreur chargement directeur:',
                    error
                );

                directorInfo = null;

                return null;
            }
        }


        // ================================================================
        // CHARGER LES PROMOTIONS
        // ================================================================

        async function loadPromotions() {

            try {

                const snapshot =
                    await db.collection(
                        'promotions'
                    ).get();

                allPromotions = [];

                snapshot.forEach(doc => {

                    allPromotions.push({
                        id: doc.id,
                        ...doc.data()
                    });

                });

                return allPromotions;

            } catch (error) {

                console.error(
                    'Erreur chargement promotions:',
                    error
                );

                allPromotions = [];

                return [];
            }
        }


        function getPromotionName(
            promotionId
        ) {

            if (!promotionId) {
                return 'Non définie';
            }

            const promo =
                allPromotions.find(
                    p => p.id === promotionId
                );

            return promo
                ? (promo.nom || promotionId)
                : promotionId;
        }


        // ================================================================
        // AFFICHAGE DU FORMULAIRE
        // ================================================================

        function renderSubmissionForm() {

            let options =

            DEPARTEMENTS.forEach(dept => {

            });

                    <div class="alert-info-custom mb-3">

                        <i class="bi bi-info-circle-fill me-2"></i>

                            <select

                                ${options}

                            </select>

                        <div class="mb-3">

                            <label
                                for="sujetProjet"
                                class="form-label">

                                <i class="bi bi-journal-text me-1"></i>

                            </label>

                            <div class="form-text">

                        <button

        }


        // ================================================================
        // AFFICHAGE PROJET SOUMIS
        // ================================================================

        function renderSubmittedProject() {

            const deptName =
                getDepartementName(
                    studentProject.departementId
                );

            const promotionName =
                getPromotionName(
                    studentProject.promotion ||
                    currentStudent.promotion
                );

            let dateSoumissionText =
                'Date inconnue';

            if (
                studentProject.dateSoumission
            ) {

                try {

                    const dateValue =
                        studentProject.dateSoumission.toDate
                            ? studentProject.dateSoumission.toDate()
                            : studentProject.dateSoumission;

                    dateSoumissionText =
                        new Date(
                            dateValue
                        ).toLocaleDateString(
                            'fr-FR'
                        );

                } catch (e) {

                    console.warn(
                        'Date de soumission invalide:',
                        e
                    );
                }
            }

            let html = `

                <div class="already-submitted-card">

                    <i class="bi bi-check-circle-fill"></i>

                    <h5>
                        Votre sujet a été soumis avec succès
                    </h5>

                    <p class="text-muted mb-0">

                        Soumis le :
                        ${escapeHtml(dateSoumissionText)}

                    </p>

                </div>


                <div class="submission-card">

                    <h3>

                        <i class="bi bi-file-text-fill me-2"></i>

                        Détails de votre sujet

                    </h3>

                    <hr>


                    <p>

                        <strong>

                            <i class="bi bi-building me-2"></i>

                            Département :

                        </strong>

                        ${escapeHtml(deptName)}

                    </p>


                    <p>

                        <strong>

                            <i class="bi bi-mortarboard-fill me-2"></i>

                            Promotion :

                        </strong>

                        ${escapeHtml(promotionName)}

                    </p>


                    <p>

                        <strong>

                            <i class="bi bi-journal-text me-2"></i>

                            Sujet :

                        </strong>

                    </p>


                    <div
                        style="
                            background:#f8f9fa;
                            padding:15px;
                            border-radius:10px;
                            border-left:4px solid var(--primary-blue);
                            margin-bottom:15px;
                        ">

                        ${escapeHtml(
                            studentProject.sujet
                        )}

                    </div>


                    ${
                        studentProject.sujetReformule
                        ? `

                            <p>

                                <strong>

                                    <i class="bi bi-pencil-square me-2"></i>

                                    Sujet reformulé par le directeur :

                                </strong>

                            </p>


                            <div
                                style="
                                    background:#fff8e1;
                                    padding:15px;
                                    border-radius:10px;

        // ================================================================
        // FEU VERT
        //
        // IMPORTANT :
        //
        // 1. feu.png doit être dans le même dossier que Projet.html.

        // 2. Les données sont dessinées UNIQUEMENT dans les zones
        //    prévues du modèle feu.png.
        //

        //
        // 4. Aucun ajout du nom/signature du doyen.

        function safeString(
            value,
            fallback = ''
        ) {

            if (
                value === null ||
                value === undefined
            ) {
                return fallback;
            }

            return String(
                value
            ).trim() || fallback;
        }


        function normalizeForDocument(
            value
        ) {

            return safeString(value)
                .replace(/\s+/g, ' ')
                .trim();
        }


        function getAcademicYear() {

            return safeString(

                studentProject?.anneeAcademique ||

                currentStudent?.anneeAcademique ||

                currentStudent?.anneeAcademiqueId ||

                '2026-2027'
            );
        }


        function getStudentFullName() {

            return normalizeForDocument(

                currentStudent?.nomComplet ||

                currentStudent?.nom ||

                studentProject?.etudiantNom ||

                'Étudiant'
            );
        }


        function getStudentMatricule() {

            return normalizeForDocument(

                currentStudent?.matricule ||

                studentProject?.etudiantMatricule ||

                'N/A'
            );
        }


        function getDirectorName() {

            return normalizeForDocument(

                directorInfo?.nomComplet ||

                directorInfo?.nom ||

                'Non renseigné'
            );
        }


        function getDirectorEmail() {

        // ================================================================
        // CODE DOCUMENT
        // ================================================================

        function makeDocumentCode() {

            const matricule =
                getStudentMatricule()
                    .replace(
                        /[^A-Za-z0-9]/g,
                        ''
                    )
                    .slice(
                        0,
                        18
                    ) ||
                'ETUDIANT';


            const date =
                new Date();


            const dd =
                String(
                    date.getDate()
                ).padStart(
                    2,
                    '0'
                );


            const mm =
                String(
                    date.getMonth() + 1
                ).padStart(
                    2,
                    '0'
                );


            const yyyy =
                date.getFullYear();


            return `FV-FSA-${matricule}-${dd}${mm}${yyyy}`;
        }


        // ================================================================
        // PAYLOAD QR COURT
        // ================================================================

        function makeShortQrPayload(
            documentCode
        ) {

            const matricule =
                getStudentMatricule()
                    .replace(
                        /[^A-Za-z0-9]/g,
                        ''
                    )
                    .slice(
                        -8
                    );


            const projectId =
                safeString(
                    studentProject?.id,
                    'PROJECT'
                )
                .replace(
                    /[^A-Za-z0-9]/g,
                    ''
                )
                .slice(
                    0,
                    8
                );


            const date =
                new Date();


            const stamp =
                String(
                    date.getFullYear()
                ) +

                String(
                    date.getMonth() + 1
                ).padStart(
                    2,
                    '0'
                ) +

                String(
                    date.getDate()
                ).padStart(
                    2,
                    '0'
                );


            /*
             * Payload volontairement très court.
             *
             * Exemple :
             *
             * FV|4119320ET|Ab12Cd34|20260904
             *
             * NE JAMAIS mettre :
             *
             * JSON.stringify(studentProject)
             *
             * dans le QR.
             */

            return `FV|${matricule}|${projectId}|${stamp}`;
        }


        // ================================================================
        // AJUSTEMENT AUTOMATIQUE DU TEXTE
        // ================================================================

        function fitText(
            ctx,
            text,
            maxWidth,
            startSize,
            minSize = 10
        ) {

            let size =
                startSize;


            while (
                size > minSize
            ) {

                ctx.font =
                    `600 ${size}px Arial`;


                if (
                    ctx.measureText(
                        text
                    ).width <= maxWidth
                ) {

                    return size;
                }


                size -= 1;
            }


            ctx.font =
                `600 ${minSize}px Arial`;


            return minSize;
        }


        // ================================================================
        // TEXTE AJUSTÉ
        // ================================================================

        function drawFittedText(
            ctx,
            text,
            x,
            y,
            maxWidth,
            startSize = 22,
            minSize = 10,
            color = '#123f78',
            align = 'left'
        ) {

            text =
                normalizeForDocument(
                    text
                );


            if (!text) return;


            const size =
                fitText(
                    ctx,
                    text,
                    maxWidth,
                    startSize,
                    minSize
                );


            ctx.save();


            ctx.font =
                `600 ${size}px Arial`;


            ctx.fillStyle =
                color;


            ctx.textAlign =
                align;


            ctx.textBaseline =
                'middle';


            ctx.fillText(
                text,
                x,
                y
            );


            ctx.restore();
        }


        // ================================================================
        // TEXTE SUR PLUSIEURS LIGNES
        // ================================================================

        function drawWrappedText(
            ctx,
            text,
            x,
            y,
            maxWidth,
            lineHeight,
            maxLines,
            startSize = 18,
            minSize = 10
        ) {

            text =
                normalizeForDocument(
                    text
                );


            if (!text) return;


            let size =
                startSize;


            let lines = [];


            while (
                size >= minSize
            ) {

                ctx.font =
                    `600 ${size}px Arial`;


                const words =
                    text.split(
                        /\s+/
                    );


                const testLines = [];


                let line = '';


                for (
                    const word of words
                ) {

                    const test =
                        line
                            ? `${line} ${word}`
                            : word;


                    if (
                        ctx.measureText(
                            test
                        ).width <= maxWidth
                    ) {

                        line =
                            test;

                    } else {

                        if (line) {
                            testLines.push(
                                line
                            );
                        }

                        line =
                            word;
                    }
                }


                if (line) {

                    testLines.push(
                        line
                    );
                }


                if (
                    testLines.length <=
                    maxLines
                ) {

                    lines =
                        testLines;

                    break;
                }


                size -= 1;
            }


            if (!lines.length) {

                ctx.font =
                    `600 ${minSize}px Arial`;

                lines = [text];

                size =
                    minSize;
            }


            ctx.save();


            ctx.font =
                `600 ${size}px Arial`;


            ctx.fillStyle =
                '#123f78';


            ctx.textAlign =
                'left';


            ctx.textBaseline =
                'top';


            lines
                .slice(
                    0,
                    maxLines
                )
                .forEach(
                    (
                        line,
                        index
                    ) => {

                        ctx.fillText(
                            line,
                            x,
                            y +
                            index *
                            lineHeight
                        );
                    }
                );


            ctx.restore();
        }


        // ================================================================
        // CHARGEMENT IMAGE
        // ================================================================

        function loadImage(url) {

            return new Promise(
                (
                    resolve,
                    reject
                ) => {

                    const img =
                        new Image();


                    img.onload =
                        () => resolve(
                            img
                        );


                    img.onerror =
                        () => {

                            reject(
                                new Error(
                                    `Impossible de charger l'image : ${url}`
                                )
                            );
                        };


                    img.src =
                        url;
                }
            );
        }


        // ================================================================
        // ATTENTE
        // ================================================================

        function wait(ms) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        ms
                    )
            );
        }


        // ================================================================
        // GÉNÉRATION QR
        // ================================================================

        async function createQRCodeDataUrl(
            text,
            size = 112
        ) {

            if (
                typeof QRCode ===
                'undefined'
            ) {

                throw new Error(
                    'La bibliothèque QR Code n’est pas chargée.'
                );
            }


            const holder =
                document.createElement(
                    'div'
                );


            holder.style.position =
                'fixed';


            holder.style.left =
                '-10000px';


            holder.style.top =
                '-10000px';


            holder.style.width =
                `${size}px`;


            holder.style.height =
                `${size}px`;


            holder.style.background =
                '#ffffff';


            document.body.appendChild(
                holder
            );


            try {

                new QRCode(
                    holder,
                    {
                        text: text,
                        width: size,
                        height: size,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel:
                            QRCode.CorrectLevel.M
                    }
                );


                for (
                    let i = 0;
                    i < 20;
                    i++
                ) {

                    const canvas =
                        holder.querySelector(
                            'canvas'
                        );


                    if (canvas) {

                        return canvas.toDataURL(
                            'image/png'
                        );
                    }


                    const img =
                        holder.querySelector(
                            'img'
                        );


                    if (
                        img &&
                        img.complete &&
                        img.naturalWidth > 0
                    ) {

                        const c =
                            document.createElement(
                                'canvas'
                            );


                        c.width =
                            size;


                        c.height =
                            size;


                        const cctx =
                            c.getContext(
                                '2d'
                            );


                        cctx.fillStyle =
                            '#ffffff';


                        cctx.fillRect(
                            0,
                            0,
                            size,
                            size
                        );


                        cctx.drawImage(
                            img,
                            0,
                            0,
                            size,
                            size
                        );


                        return c.toDataURL(
                            'image/png'
                        );
                    }


                    await wait(50);
                }


                throw new Error(
                    'Le QR Code n’a pas pu être généré.'
                );


            } finally {

                holder.remove();
            }
        }

                if (!ctx) {

                    throw new Error(

                    );
                }


                ctx.imageSmoothingEnabled =
                    true;


                ctx.imageSmoothingQuality =
                    'high';


                ctx.drawImage(
                    background,

                    canvas.width,
                    canvas.height
                );


                // ========================================================

                // ========================================================

                drawFittedText(

                // ========================================================
                // 5. QR CODE
                // ========================================================

                const qrDataUrl =
                    await createQRCodeDataUrl(
                        qrPayload,
                        112
                    );


                const qrImage =
                    await loadImage(
                        qrDataUrl
                    );


                // Fond blanc de sécurité.

                ctx.save();


                ctx.fillStyle =
                    '#ffffff';


                ctx.fillRect(
                    858,
                    1255,
                    112,
                    112
                );


                ctx.drawImage(
                    qrImage,
                    858,
                    1255,
                    112,
                    112
                );


                ctx.restore();


                // Code sous le QR.

                drawFittedText(
                    ctx,
                    documentCode,
                    914,
                    1378,
                    145,
                    10,
                    7,
                    '#123f78',
                    'center'
                );


                // ========================================================
                // 6. IMAGE FINALE
                // ========================================================

                const finalDataUrl =
                    canvas.toDataURL(
                        'image/jpeg',
                        0.94
                    );


                // ========================================================
                // 7. PDF A4
                // ========================================================

                const {
                    jsPDF
                } =
                    window.jspdf;


                const pdf =
                    new jsPDF(
                        {
                            orientation:
                                'portrait',

                            unit:
                                'mm',

                            format:
                                'a4',

                            compress:
                                true
                        }
                    );


                pdf.addImage(
                    finalDataUrl,
                    'JPEG',
                    0,
                    0,
                    210,
                    297,
                    undefined,
                    'FAST'
                );


                pdf.setProperties(
                    {
                        title:
                            'Feu Vert - Projet de Fin d’Études',

                        subject:
                            'Feuille de Fin d’Études',

                        author:
                            'Faculté des Sciences Agronomiques - UNILU',

                        creator:
                            'HYBRILINK-TECH',

                        keywords:
                            'Feu Vert, FSAE, UNILU, Projet de Fin d’Études'
                    }
                );


                // ========================================================
                // 8. NOM DU FICHIER
                // ========================================================

                const safeMatricule =
                    matricule
                        .replace(
                            /[^\w-]+/g,
                            '_'
                        )
                        .replace(
                            /^_+|_+$/g,
                            ''
                        ) ||
                    'etudiant';


                pdf.save(
                    `Feu_Vert_${safeMatricule}.pdf`
                );


                showLoading(false);


                showToast(
                    '✅ Feu Vert généré et téléchargé avec succès !',
                    'success'
                );


            } catch (error) {

                console.error(
                    'Erreur génération Feu Vert:',
                    error
                );


                showLoading(false);


                showToast(
                    '❌ Impossible de générer le Feu Vert : ' +
                    (
                        error.message ||
                        'erreur inconnue'
                    ),
                    'danger'
                );


            } finally {

                if (button) {

                    button.disabled =
                        false;

                    button.innerHTML =
                        '<i class="bi bi-download"></i> Télécharger le Feu Vert (PDF)';
                }
            }
        }


        // ================================================================
        // SERVICE WORKER CENTRAL
        // ================================================================

        async function registerServiceWorker() {

            if (
                !('serviceWorker' in navigator)
            ) {

                console.warn(
                    '⚠️ Service Worker non supporté.'
                );

                return null;
            }


            try {

                /*
                 * PRIORITÉ :
                 *
                 * notification-utils.js fournit maintenant
                 * la fonction centrale :
                 *
                 * window.registerAppServiceWorker()
                 *
                 * On l'utilise afin d'éviter plusieurs
                 * Service Workers concurrents.
                 */

                if (
                    typeof window.registerAppServiceWorker ===
                    'function'
                ) {

                    const registration =
                        await window.registerAppServiceWorker();


                    console.log(
                        '✅ Service Worker central utilisé.',
                        registration
                    );


                    return registration;
                }


                /*
                 * FALLBACK :
                 *
                 * Si notification-utils.js n'est pas disponible,
                 * on enregistre directement sw.js.
                 *
                 * Aucun SAVE_STUDENT_SESSION ici.
                 */

                const scope =
                    '/Espace-etudiant/';


                let registration =
                    await navigator.serviceWorker
                        .getRegistration(
                            scope
                        );


                if (!registration) {

                    registration =
                        await navigator.serviceWorker
                            .register(
                                './sw.js',
                                {
                                    scope:
                                        scope
                                }
                            );
                }


                console.log(
                    '✅ Service Worker fallback enregistré.',
                    registration
                );


                return registration;

            } catch (error) {

                console.error(
                    '❌ Erreur Service Worker:',
                    error
                );

                return null;
            }
        }


        // ================================================================
        // INITIALISATION NOTIFICATIONS
        // ================================================================

        async function initializeNotifications() {

            try {

                const loaded =
                    await loadNotificationUtils();


                if (!loaded) {

                    console.warn(
                        '⚠️ Gestionnaire de notifications indisponible.'
                    );

                    return;
                }


                if (
                    window.notificationManager &&
                    currentStudent?.id
                ) {

                    await window.notificationManager.init(
                        currentStudent.id,
                        currentStudent.nom || '',
                        currentStudent.promotion || ''
                    );


                    console.log(
                        '🔔 Notification Manager initialisé pour l’étudiant.'
                    );

                } else {

                    console.warn(
                        '⚠️ notificationManager non disponible.'
                    );
                }


            } catch (error) {

                console.warn(
                    '⚠️ Initialisation notifications impossible:',
                    error
                );
            }
        }


        // ================================================================
        // INITIALISATION
        // ================================================================

        async function init() {

            if (!checkSession()) {
                return;
            }


            console.log(
                '🚀 Page Projet Étudiant - Initialisation'
            );


            console.log(
                '👤 Étudiant:',
                currentStudent.nom
            );


            console.log(
                '🆔 ID étudiant:',
                currentStudent.id
            );


            console.log(
                '📋 Départements disponibles:',
                DEPARTEMENTS
            );


            // ============================================================
            // ANIMATION TOAST
            // ============================================================

            const style =
                document.createElement(
                    'style'
                );


            style.textContent = `

                @keyframes slideInRight {

                    from {
                        transform:
                            translateX(100%);

                        opacity:
                            0;
                    }

                    to {
                        transform:
                            translateX(0);

                        opacity:
                            1;
                    }
                }

            `;


            document.head.appendChild(
                style
            );


            // ============================================================
            // NOTIFICATIONS
            // ============================================================

            await initializeNotifications();


            // ============================================================
            // SERVICE WORKER CENTRAL
            // ============================================================

            await registerServiceWorker();


            // ============================================================
            // PAGE
            // ============================================================

            await renderPage();


            // ============================================================
            // ÉCOUTE TEMPS RÉEL DU PROJET
            // ============================================================

            try {

                const snapshot =
                    await db.collection(
                        'projets'
                    )
                    .where(
                        'etudiantId',
                        '==',
                        currentStudent.id
                    )
                    .limit(1)
                    .get();


                if (!snapshot.empty) {

                    const projectId =
                        snapshot.docs[0].id;


                    db.collection(
                        'projets'
                    )
                    .doc(projectId)
                    .onSnapshot(

                        async (doc) => {

                            if (!doc.exists) {
                                return;
                            }


                            const oldEtape =
                                studentProject
                                    ? Number(
                                        studentProject.etape ||
                                        0
                                    )
                                    : 0;


                            const oldDirecteurId =
                                studentProject
                                    ? studentProject.directeurId
                                    : null;


                            const oldSujetReformule =
                                studentProject
                                    ? studentProject.sujetReformule ||
                                      ''
                                    : '';


                            studentProject = {

                                id:
                                    doc.id,

                                ...doc.data()
                            };


                            const newEtape =
                                Number(
                                    studentProject.etape ||
                                    0
                                );


                            // =================================================
                            // ÉTAPE MODIFIÉE
                            // =================================================

                            if (
                                newEtape !==
                                oldEtape
                            ) {

                                const newPourcentage =
                                    Math.max(
                                        0,
                                        Math.min(
                                            100,
                                            newEtape *
                                            25
                                        )
                                    );


                                showToast(

                                    `🎉 Progression mise à jour : ${newPourcentage}% - ` +

                                    (
                                        newEtape >= 4

                                            ? 'Feu Vert obtenu !'

                                            : 'Étape ' +
                                              newEtape +
                                              ' validée'
                                    ),

                                    'info'
                                );


                                await renderPage();
                            }


                            // =================================================
                            // DIRECTEUR MODIFIÉ
                            // =================================================

                            if (

                                studentProject.directeurId !==
                                oldDirecteurId

                                &&

                                studentProject.directeurId

                            ) {

                                await loadDirectorInfo(
                                    studentProject.directeurId
                                );


                                showToast(
                                    '👨‍🏫 Un directeur de projet vous a été assigné !',
                                    'info'
                                );


                                await renderPage();
                            }


                            // =================================================
                            // SUJET REFORMULÉ
                            // =================================================

                            const newSujetReformule =
                                studentProject.sujetReformule ||
                                '';


                            if (
                                newSujetReformule &&
                                newSujetReformule !==
                                oldSujetReformule
                            ) {

                                showToast(
                                    '✏️ Votre sujet a été reformulé par votre directeur.',
                                    'info'
                                );


                                await renderPage();
                            }

                        },


                        (error) => {

                            console.error(
                                'Erreur écoute projet:',
                                error
                            );
                        }
                    );
                }


            } catch (error) {

                console.error(
                    'Erreur initialisation écoute temps réel:',
                    error
                );
            }


            console.log(
                '✅ Page Projet Étudiant prête'
            );
        }


        // ================================================================
        // LANCEMENT
        // ================================================================

        init();

    </script>
