<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FSA-IA - Assistant Intelligent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ============================================================
           MODE SOMBRE (par défaut)
        ============================================================ */
        body.dark {
            background: #0a0c10;
            color: #f5f7fa;
        }

        body.dark .ai-app {
            background: #0a0c10;
        }

        body.dark .top-bar {
            background: #0a0c10;
            border-bottom: 1px solid #1e2026;
        }

        body.dark .brand-text {
            color: #f5f7fa;
        }

        body.dark .top-btn {
            border: 1px solid #2a2c33;
            color: #a6a9b2;
        }

        body.dark .top-btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: #3d3f46;
            color: #f5f7fa;
        }

        body.dark .top-btn.history-btn {
            border-color: #003366;
            color: #4caf50;
        }

        body.dark .top-btn.history-btn:hover {
            background: rgba(0,51,102,0.15);
        }

        body.dark .welcome-title {
            color: #f5f7fa;
        }

        body.dark .welcome-sub {
            color: #747780;
        }

        body.dark .message.ai .bubble {
            background: #1e2026;
            border: 1px solid #2a2c33;
            color: #f5f7fa;
        }

        body.dark .message.user .bubble {
            background: #003366;
            color: white;
        }

        body.dark .message.ai .timestamp {
            color: #5a5d66;
        }

        body.dark .message.user .timestamp {
            color: rgba(255,255,255,0.35);
        }

        body.dark .input-area {
            background: #181a20;
            border: 1px solid #2a2c33;
        }

        body.dark .input-area:focus-within {
            border-color: #003366;
            box-shadow: 0 0 0 1px rgba(0,51,102,0.4), 0 8px 35px rgba(0,0,0,0.4);
        }

        body.dark .input-area textarea {
            color: #f5f7fa;
        }

        body.dark .input-area textarea::placeholder {
            color: #6a6d78;
        }

        body.dark .mode-btn {
            border: 1px solid #2a2c33;
            color: #747780;
        }

        body.dark .mode-btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: #3d3f46;
            color: #a6a9b2;
        }

        body.dark .mode-btn.active {
            background: rgba(0,51,102,0.2);
            border-color: #003366;
            color: #f5f7fa;
        }

        body.dark .bottom-note {
            color: #4a4d56;
        }

        body.dark .bottom-note span {
            color: #5a5d66;
        }

        body.dark .history-modal {
            background: #181a20;
            border: 1px solid #2a2c33;
        }

        body.dark .history-item {
            background: #1e2026;
            border: 1px solid #2a2c33;
        }

        body.dark .history-item:hover {
            border-color: #003366;
            background: #23262e;
        }

        body.dark .history-item .h-date {
            color: #747780;
        }

        body.dark .history-item .h-preview {
            color: #a6a9b2;
        }

        body.dark .history-empty {
            color: #747780;
        }

        body.dark .history-actions button {
            border: 1px solid #2a2c33;
            color: #a6a9b2;
        }

        body.dark .history-actions button:hover {
            background: rgba(255,255,255,0.05);
            border-color: #3d3f46;
            color: #f5f7fa;
        }

        body.dark .history-header h3 {
            color: #f5f7fa;
        }

        body.dark .history-header button {
            color: #747780;
        }

        body.dark .history-header button:hover {
            color: #f5f7fa;
        }

        body.dark .typing-indicator {
            background: #1e2026;
            border: 1px solid #2a2c33;
        }

        /* ============================================================
           MODE CLAIR
        ============================================================ */
        body.light {
            background: #f0f2f5;
            color: #1a1a2e;
        }

        body.light .ai-app {
            background: #f0f2f5;
        }

        body.light .top-bar {
            background: #ffffff;
            border-bottom: 1px solid #d1d5db;
        }

        body.light .brand-text {
            color: #1a1a2e;
        }

        body.light .top-btn {
            border: 1px solid #d1d5db;
            color: #4a4d56;
        }

        body.light .top-btn:hover {
            background: rgba(0,0,0,0.04);
            border-color: #a6a9b2;
            color: #1a1a2e;
        }

        body.light .top-btn.history-btn {
            border-color: #003366;
            color: #003366;
        }

        body.light .top-btn.history-btn:hover {
            background: rgba(0,51,102,0.08);
        }

        body.light .top-btn.history-btn i {
            color: #003366;
        }

        body.light .welcome-title {
            color: #1a1a2e;
        }

        body.light .welcome-sub {
            color: #6a6d78;
        }

        body.light .message.ai .bubble {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #1a1a2e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        body.light .message.user .bubble {
            background: #003366;
            color: white;
        }

        body.light .message.ai .timestamp {
            color: #8a8d96;
        }

        body.light .message.user .timestamp {
            color: rgba(255,255,255,0.4);
        }

        body.light .input-area {
            background: #ffffff;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        body.light .input-area:focus-within {
            border-color: #003366;
            box-shadow: 0 0 0 1px rgba(0,51,102,0.2), 0 4px 25px rgba(0,0,0,0.08);
        }

        body.light .input-area textarea {
            color: #1a1a2e;
        }

        body.light .input-area textarea::placeholder {
            color: #9a9da6;
        }

        body.light .mode-btn {
            border: 1px solid #d1d5db;
            color: #6a6d78;
        }

        body.light .mode-btn:hover {
            background: rgba(0,0,0,0.04);
            border-color: #a6a9b2;
            color: #1a1a2e;
        }

        body.light .mode-btn.active {
            background: rgba(0,51,102,0.1);
            border-color: #003366;
            color: #003366;
        }

        body.light .bottom-note {
            color: #8a8d96;
        }

        body.light .bottom-note span {
            color: #6a6d78;
        }

        body.light .history-modal {
            background: #ffffff;
            border: 1px solid #d1d5db;
        }

        body.light .history-item {
            background: #f8f9fa;
            border: 1px solid #e5e7eb;
        }

        body.light .history-item:hover {
            border-color: #003366;
            background: #eef2f7;
        }

        body.light .history-item .h-date {
            color: #8a8d96;
        }

        body.light .history-item .h-preview {
            color: #4a4d56;
        }

        body.light .history-empty {
            color: #8a8d96;
        }

        body.light .history-actions button {
            border: 1px solid #d1d5db;
            color: #4a4d56;
        }

        body.light .history-actions button:hover {
            background: rgba(0,0,0,0.04);
            border-color: #a6a9b2;
            color: #1a1a2e;
        }

        body.light .history-header h3 {
            color: #1a1a2e;
        }

        body.light .history-header button {
            color: #8a8d96;
        }

        body.light .history-header button:hover {
            color: #1a1a2e;
        }

        body.light .typing-indicator {
            background: #ffffff;
            border: 1px solid #d1d5db;
        }

        body.light .typing-indicator span {
            background: #003366;
        }

        body.light .history-overlay {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }

        body.light .btn-send {
            background: #003366;
            color: white;
        }

        body.light .btn-send:hover {
            background: #004488;
        }

        /* ============================================================
           APP
        ============================================================ */
        .ai-app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.3s ease;
        }

        /* ============================================================
           TOP BAR
        ============================================================ */
        .top-bar {
            width: 100%;
            height: 64px;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f5f7fa;
            text-decoration: none;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #003366;
            font-size: 17px;
            color: white;
            flex-shrink: 0;
        }

        .brand-text {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
            transition: color 0.3s ease;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-btn {
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            border-radius: 20px;
            background: transparent;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }

        .top-btn i {
            margin-right: 6px;
            font-size: 14px;
        }

        .top-btn.history-btn i {
            color: inherit;
        }

        /* ============================================================
           MAIN
        ============================================================ */
        .main-content {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 30px;
            overflow: hidden;
            position: relative;
        }

        .center-content {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            margin-top: -20px;
        }

        /* ============================================================
           WELCOME
        ============================================================ */
        .welcome-area {
            width: 100%;
            text-align: center;
            margin-bottom: 24px;
            flex-shrink: 0;
        }

        .welcome-title {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            transition: color 0.3s ease;
        }

        .welcome-sub {
            font-size: 14px;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        /* ============================================================
           CHAT ZONE
        ============================================================ */
        .chat-zone {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        /* ============================================================
           MESSAGES
        ============================================================ */
        .messages-container {
            width: 100%;
            flex: 1;
            overflow-y: auto;
            padding: 8px 4px 16px;
            display: none;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .messages-container.has-messages {
            display: block;
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #3d3f46;
            border-radius: 10px;
        }

        body.light .messages-container::-webkit-scrollbar-thumb {
            background: #b0b3bc;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ============================================================
           MESSAGE BUBBLES
        ============================================================ */
        .message {
            display: flex;
            width: 100%;
            margin-bottom: 14px;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .message.user .bubble {
            background: #003366;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message .bubble p {
            margin-bottom: 6px;
        }
        .message .bubble p:last-child { margin-bottom: 0; }
        .message .bubble ul, .message .bubble ol {
            margin: 6px 0;
            padding-left: 18px;
        }
        .message .bubble li { margin-bottom: 3px; }
        .message .bubble code {
            background: rgba(255,255,255,0.08);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.85em;
        }
        body.light .message .bubble code {
            background: rgba(0,0,0,0.06);
        }
        .message .bubble pre {
            background: #0b0d11;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            margin: 6px 0;
        }
        body.light .message .bubble pre {
            background: #eef0f2;
            color: #1a1a2e;
        }
        .message .bubble pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .timestamp {
            display: block;
            font-size: 9px;
            margin-top: 5px;
            text-align: right;
            transition: color 0.3s ease;
        }

        /* ============================================================
           TYPING
        ============================================================ */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 5px;
            padding: 10px 14px;
            border-radius: 14px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            margin-bottom: 14px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .typing-indicator.show {
            display: flex;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4caf50;
            opacity: 0.4;
            animation: typingBounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ============================================================
           INPUT SECTION
        ============================================================ */
        .input-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            padding: 0 4px;
        }

        .input-area {
            width: 100%;
            border-radius: 24px;
            padding: 14px 16px 10px 18px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .input-area textarea {
            width: 100%;
            min-height: 44px;
            max-height: 120px;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            padding: 0 4px;
            transition: color 0.3s ease;
        }

        .input-area textarea::-webkit-scrollbar {
            width: 3px;
        }
        .input-area textarea::-webkit-scrollbar-thumb {
            background: #3d3f46;
            border-radius: 10px;
        }
        body.light .input-area textarea::-webkit-scrollbar-thumb {
            background: #b0b3bc;
        }

        .input-bottom {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            flex-shrink: 0;
        }

        /* ============================================================
           MODE BUTTONS
        ============================================================ */
        .mode-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn {
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            height: 28px;
            display: flex;
            align-items: center;
            background: transparent;
        }

        .btn-send {
            width: 42px;
            height: 42px;
            min-width: 42px;
            min-height: 42px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }

        .btn-send:hover {
            transform: scale(1.03);
        }

        .btn-send:active {
            transform: scale(0.93);
        }

        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-send .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.25);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-send.loading .spinner {
            display: block;
        }
        .btn-send.loading i {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .bottom-note {
            margin-top: 12px;
            text-align: center;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        /* ============================================================
           TOAST
        ============================================================ */
        .toast-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
            width: min(340px, calc(100vw - 40px));
        }

        .toast-custom {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 46px;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            animation: slideInRight 0.3s ease-out;
        }

        .toast-custom .close-toast {
            margin-left: auto;
            border: none;
            background: transparent;
            color: inherit;
            font-size: 18px;
            opacity: 0.6;
            cursor: pointer;
        }
        .toast-custom .close-toast:hover { opacity: 1; }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ============================================================
           HISTORIQUE - MODAL
        ============================================================ */
        .history-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 100000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .history-overlay.show {
            display: flex;
        }

        .history-modal {
            border-radius: 24px;
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            animation: fadeInUp 0.3s ease;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .history-header h3 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            transition: color 0.3s ease;
        }

        .history-header button {
            background: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 0 8px;
            transition: color 0.2s;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #3d3f46;
            border-radius: 10px;
        }
        body.light .history-list::-webkit-scrollbar-thumb {
            background: #b0b3bc;
        }

        .history-item {
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item .h-date {
            font-size: 10px;
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }

        .history-item .h-preview {
            font-size: 13px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s ease;
        }

        .history-item .h-count {
            font-size: 10px;
            color: #4caf50;
            margin-top: 4px;
        }

        .history-empty {
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .history-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-shrink: 0;
        }

        .history-actions button {

const firebaseConfig = {

/* ================================================================
   SESSION
================================================================ */
let currentStudent = null;

function checkSession() {
    const session = localStorage.getItem('session_etudiant');
    if (!session) {
        window.location.href = 'login-etudiant.html';
        return false;
    }
    try {
        const data = JSON.parse(session);
        if (!data || !data.expires || Date.now() > Number(data.expires)) {
            localStorage.removeItem('session_etudiant');
            window.location.href = 'login-etudiant.html';
            return false;
        }
        currentStudent = data;
        return true;
    } catch (e) {
        localStorage.removeItem('session_etudiant');
        window.location.href = 'login-etudiant.html';
        return false;
    }
}

/* ================================================================
   THEME MANAGEMENT
================================================================ */
function setTheme(theme) {
    document.body.classList.remove('dark', 'light');
    document.body.classList.add(theme);
    localStorage.setItem('fsa_theme', theme);

    const icon = document.getElementById('themeIcon');
    const label = document.getElementById('themeLabel');

    if (theme === 'light') {
        icon.className = 'bi bi-sun-fill';
        label.textContent = 'Clair';
    } else {
        icon.className = 'bi bi-moon-fill';
        label.textContent = 'Sombre';
    }
}

function toggleTheme() {
    const current = document.body.classList.contains('dark') ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    setTheme(next);
    showToast(`Mode ${next === 'light' ? '☀️ Clair' : '🌙 Sombre'} activé`, 'info');
}

// Charger le thème sauvegardé
function loadTheme() {
    const saved = localStorage.getItem('fsa_theme');
    if (saved && (saved === 'light' || saved === 'dark')) {
        setTheme(saved);
    } else {
        setTheme('dark');
    }
}

/* ================================================================
   STOCKAGE LOCAL DES CONVERSATIONS
================================================================ */
const STORAGE_KEY = 'fsa_chat_history';

function getHistory() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    } catch (e) {
        return [];
    }
}

function saveHistory(history) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) {
        console.error('Erreur sauvegarde historique:', e);
    }
}

function saveCurrentConversation() {
    if (conversationHistory.length === 0) return;

    const history = getHistory();
    const newConv = {
        id: Date.now().toString(),
        date: new Date().toISOString(),
        messages: [...conversationHistory],
        preview: conversationHistory[0]?.content?.substring(0, 60) || 'Conversation',
        count: conversationHistory.length
    };

    const exists = history.some(h => 
        h.messages.length === newConv.messages.length &&
        h.messages[0]?.content === newConv.messages[0]?.content
    );

    if (!exists) {
        history.unshift(newConv);
        if (history.length > 50) history.pop();
        saveHistory(history);
    }
}

/* ================================================================
   TOAST
================================================================ */
function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const colors = {
        success: { bg: '#059669', icon: 'bi-check-circle-fill' },
        warning: { bg: '#d97706', icon: 'bi-exclamation-triangle-fill' },
        danger: { bg: '#dc2626', icon: 'bi-x-circle-fill' },
        info: { bg: '#2563eb', icon: 'bi-info-circle-fill' }
    };
    const config = colors[type] || colors.success;
    const toast = document.createElement('div');
    toast.className = 'toast-custom';
    toast.style.background = config.bg;
    toast.innerHTML = `
        <i class="bi ${config.icon}"></i>
        <span>${escapeHtml(message)}</span>
        <button class="close-toast" onclick="this.parentElement.remove()">&times;</button>
    `;
    container.prepend(toast);
    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

/* ================================================================
   DOM
================================================================ */
const messagesContainer = document.getElementById('messagesContainer');
const messagesWrapper = document.getElementById('messagesWrapper');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const typingIndicator = document.getElementById('typingIndicator');

let conversationHistory = [];
let isProcessing = false;
let currentMode = 'instant';
let selectedHistoryIdForActions = null;

/* ================================================================
   MODE BUTTONS
================================================================ */
document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentMode = this.dataset.mode;
        showToast(`Mode ${currentMode} activé`, 'info');
    });
});

/* ================================================================
   ADD MESSAGE
================================================================ */
function addMessage(content, sender = 'user') {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (sender === 'ai') {
        if (typeof marked !== 'undefined') {
            try { bubble.innerHTML = marked.parse(content); }
            catch (e) { bubble.textContent = content; }
        } else {
            bubble.textContent = content;
        }
    } else {
        bubble.textContent = content;
    }

    const timestamp = document.createElement('span');
    timestamp.className = 'timestamp';
    timestamp.textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    bubble.appendChild(timestamp);
    div.appendChild(bubble);
    messagesWrapper.appendChild(div);

    messagesContainer.classList.add('has-messages');
    scrollToBottom();

    conversationHistory.push({
        role: sender === 'ai' ? 'assistant' : 'user',
        content: content
    });
}

/* ================================================================
   TYPING
================================================================ */
function showTyping() {
    typingIndicator.classList.add('show');
    messagesContainer.classList.add('has-messages');
    scrollToBottom();
}

function hideTyping() {
    typingIndicator.classList.remove('show');
}

function scrollToBottom() {
    setTimeout(() => {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }, 50);
}

/* ================================================================
   SEND MESSAGE
================================================================ */
async function sendMessage() {
    const message = messageInput.value.trim();
    if (!message || isProcessing) return;

    messageInput.value = '';
    messageInput.style.height = 'auto';
    addMessage(message, 'user');

    isProcessing = true;
    sendBtn.classList.add('loading');
    sendBtn.disabled = true;
    messageInput.disabled = true;
    showTyping();

    try {
        const response = await queryGroq(message);
        hideTyping();
        addMessage(response, 'ai');
        saveCurrentConversation();
    } catch (error) {
        hideTyping();
        console.error('[GROQ] Erreur:', error);
        let errorMessage = '❌ Désolé, une erreur est survenue. Veuillez réessayer.';
        if (error.message.includes('API key')) errorMessage = '❌ Clé API invalide.';
        else if (error.message.includes('rate limit')) errorMessage = '⏳ Trop de requêtes. Patientez.';
        else if (error.message.includes('timeout')) errorMessage = '⏰ Délai d\'attente dépassé.';
        showToast(errorMessage, 'danger');
        addMessage(errorMessage + ' 🔄 Réessayez.', 'ai');
    } finally {
        isProcessing = false;
        sendBtn.classList.remove('loading');
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
    }
}

/* ================================================================
   GROQ
================================================================ */
async function queryGroq(userMessage) {
    const messages = [];
    messages.push({
        role: 'system',
        content: `Tu es FSA-IA, assistant de la Faculté des Sciences Agronomiques UNILU.
RÉPONDS UNIQUEMENT EN FRANÇAIS.
Sois clair, précis et pédagogique.
Utilise le Markdown pour structurer.
Mode actuel: ${currentMode}.`
    });

    const historyLimit = conversationHistory.slice(-8);
    for (const msg of historyLimit) {
        if (msg.role === 'user' || msg.role === 'assistant') {
            messages.push({ role: msg.role, content: msg.content });
        }
    }

    const payload = {
        model: GROQ_CONFIG.model,
        messages: messages,
        temperature: 0.7,
        max_tokens: 1024,
        stream: false
    };

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000);

    try {
        const response = await fetch(GROQ_CONFIG.endpoint, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${GROQ_CONFIG.apiKey}`
            },
            body: JSON.stringify(payload),
            signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!response.ok) {
            const errorText = await response.text();
            console.error('[GROQ] Erreur API:', response.status, errorText);
            if (response.status === 401) throw new Error('API key invalide');
            if (response.status === 429) throw new Error('rate limit dépassé');
            throw new Error(`Erreur API (${response.status})`);
        }

        const data = await response.json();
        if (!data.choices || data.choices.length === 0) throw new Error('Réponse vide');
        return data.choices[0].message.content;
    } catch (error) {
        clearTimeout(timeoutId);
        if (error.name === 'AbortError') throw new Error('timeout');
        throw error;
    }
}

/* ================================================================
   AUTO RESIZE
================================================================ */
function autoResize(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
}

messageInput.addEventListener('input', function() { autoResize(this); });

/* ================================================================
   HISTORIQUE - MODAL
================================================================ */
const historyOverlay = document.getElementById('historyOverlay');
const historyList = document.getElementById('historyList');

function renderHistory() {
    const history = getHistory();
    historyList.innerHTML = '';

    if (history.length === 0) {
        historyList.innerHTML = `<div class="history-empty">
            <i class="bi bi-inbox" style="font-size:32px;display:block;margin-bottom:12px;color:#3d3f46;"></i>
            Aucune conversation enregistrée
        </div>`;
        return;
    }

    history.forEach((conv) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        if (selectedHistoryIdForActions === conv.id) {
            item.style.borderColor = '#003366';
            item.style.background = document.body.classList.contains('dark') ? '#23262e' : '#eef2f7';
        }
        const date = new Date(conv.date);
        const dateStr = date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

        item.innerHTML = `
            <div class="h-date">${dateStr}</div>
            <div class="h-preview">${escapeHtml(conv.preview)}</div>
            <div class="h-count">${conv.count} messages</div>
        `;

        item.addEventListener('click', function() {
            selectedHistoryIdForActions = conv.id;
            renderHistory();
        });

        item.addEventListener('dblclick', function() {
            loadConversation(conv.id);
        });

        historyList.appendChild(item);
    });
}

function loadConversation(id) {
    const history = getHistory();
    const conv = history.find(h => h.id === id);
    if (!conv) {
        showToast('Conversation introuvable', 'danger');
        return;
    }

    messagesWrapper.innerHTML = '';
    conversationHistory = [];
    messagesContainer.classList.remove('has-messages');

    conv.messages.forEach(msg => {
        const sender = msg.role === 'assistant' ? 'ai' : 'user';
        addMessage(msg.content, sender);
    });

    conversationHistory = [...conv.messages];
    selectedHistoryIdForActions = null;
    historyOverlay.classList.remove('show');
    showToast(`✅ Conversation chargée (${conv.count} messages)`, 'success');
    setTimeout(() => messageInput.focus(), 300);
}

function deleteHistoryItem(id) {
    if (!confirm('Supprimer cette conversation ?')) return;
    let history = getHistory();
    history = history.filter(h => h.id !== id);
    saveHistory(history);
    if (selectedHistoryIdForActions === id) selectedHistoryIdForActions = null;
    renderHistory();
    showToast('🗑️ Conversation supprimée', 'success');
}

function clearAllHistory() {
    if (!confirm('⚠️ Supprimer TOUTES les conversations enregistrées ?')) return;
    saveHistory([]);
    selectedHistoryIdForActions = null;
    renderHistory();
    showToast('🗑️ Tout l\'historique a été supprimé', 'success');
}

/* ================================================================
   HISTORIQUE - EVENTS
================================================================ */
document.getElementById('historyBtn').addEventListener('click', function() {
    renderHistory();
    historyOverlay.classList.add('show');
});

document.getElementById('closeHistoryBtn').addEventListener('click', function() {
    historyOverlay.classList.remove('show');
});

historyOverlay.addEventListener('click', function(e) {
    if (e.target === this) {
        historyOverlay.classList.remove('show');
    }
});

document.getElementById('loadHistoryBtn').addEventListener('click', function() {
    if (!selectedHistoryIdForActions) {
        showToast('Veuillez sélectionner une conversation', 'warning');
        return;
    }
    loadConversation(selectedHistoryIdForActions);
});

document.getElementById('deleteHistoryBtn').addEventListener('click', function() {
    if (!selectedHistoryIdForActions) {
        showToast('Veuillez sélectionner une conversation', 'warning');
        return;
    }
    deleteHistoryItem(selectedHistoryIdForActions);
});

document.getElementById('clearAllHistoryBtn').addEventListener('click', clearAllHistory);

/* ================================================================
   THEME TOGGLE
================================================================ */
document.getElementById('themeToggle').addEventListener('click', toggleTheme);

/* ================================================================
   CLEAR CHAT
================================================================ */
document.getElementById('clearChatBtn').addEventListener('click', function() {
    if (conversationHistory.length === 0) {
        showToast('💬 La conversation est déjà vide', 'info');
        return;
    }
    if (confirm('Voulez-vous vraiment effacer la conversation actuelle ?')) {
        if (conversationHistory.length > 0) {
            saveCurrentConversation();
        }
        messagesWrapper.innerHTML = '';
        conversationHistory = [];
        messagesContainer.classList.remove('has-messages');
        showToast('🗑️ Conversation effacée (sauvegardée dans l\'historique)', 'success');
        setTimeout(() => messageInput.focus(), 300);
    }
});

/* ================================================================
   EVENTS
================================================================ */
sendBtn.addEventListener('click', sendMessage);

messageInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

/* ================================================================
   INIT
================================================================ */
function init() {
    if (!checkSession()) return;
    loadTheme();
    console.log('🚀 FSA-IA activé | Mode:', currentMode);
    console.log('📚 Historique:', getHistory().length, 'conversations');
    console.log('🎨 Thème:', document.body.classList.contains('dark') ? 'Sombre' : 'Clair');

    setTimeout(() => {
        addMessage('👋 Bonjour ! Je suis **FSA-IA**, votre assistant intelligent. Posez-moi vos questions en français.', 'ai');
        setTimeout(() => messageInput.focus(), 300);
    }, 500);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

window.showToast = showToast;
window.sendMessage = sendMessage;
window.addMessage = addMessage;

</script>

</body>
</html>
