        // ================================================================

        /*

        (function loadNotificationManager() {

        // ================================================================

        // ================================================================

        function checkSession() {

            const session =
                localStorage.getItem('session_etudiant');

            if (!session) {

                window.location.href =
                    'login-etudiant.html';

                return false;
            }

            try {

                const data = JSON.parse(session);

                if (
                    !data ||
                    !data.id ||
                    !data.expires ||
                    Date.now() > data.expires
                ) {

                    localStorage.removeItem(
                        'session_etudiant'
                    );

                    window.location.href =
                        'login-etudiant.html';

                    return false;
                }

                currentStudent = data;

                console.log(
                    '✅ Session étudiant valide:',
                    currentStudent.id
                );

                return true;

            } catch (error) {

                console.error(
                    '❌ Session invalide:',
                    error
                );

                localStorage.removeItem(
                    'session_etudiant'
                );

                window.location.href =
                    'login-etudiant.html';

                return false;
            }
        }


        // ================================================================
        // 5. FONCTIONS UTILITAIRES
        // ================================================================

        function showToast(
            message,
            type = 'success'
        ) {

            const container =
                document.getElementById(
                    'toastContainer'
                );

            if (!container) return;

            const toast =
                document.createElement('div');

            toast.className =
                'toast-custom';

            const colors = {

                success: {
                    bg: '#28a745',
                    icon: 'bi-check-circle-fill'
                },

                warning: {
                    bg: '#ffc107',
                    icon: 'bi-exclamation-triangle-fill',
                    textColor: '#333'
                },

                danger: {
                    bg: '#dc3545',
                    icon: 'bi-x-circle-fill'
                },

                info: {
                    bg: '#17a2b8',
                    icon: 'bi-info-circle-fill'
                }

            };

            const config =
                colors[type] ||
                colors.success;

            const textColor =
                config.textColor ||
                'white';

            toast.style.background =
                config.bg;

            toast.style.color =
                textColor;

            toast.innerHTML = `
                <i class="bi ${config.icon}"></i>
                <span>${escapeHtml(message)}</span>
                <button
                    class="close-toast"
                    type="button"
                    aria-label="Fermer"
                    onclick="this.parentElement.remove()"
                >
                    &times;
                </button>
            `;

            container.prepend(toast);

            setTimeout(() => {

                if (toast.parentNode) {
                    toast.remove();
                }

            }, 5000);
        }


        function escapeHtml(text) {

            if (
                text === null ||
                text === undefined
            ) {
                return '';
            }

            const div =
                document.createElement('div');

            div.textContent =
                String(text);

            return div.innerHTML;
        }


        function formatDateTime(date) {

            if (!date) return '-';

            try {

                if (
                    date &&
                    typeof date.toDate === 'function'
                ) {
                    date = date.toDate();
                }

                else if (
                    date &&
                    typeof date.seconds === 'number'
                ) {
                    date =
                        new Date(
                            date.seconds * 1000
                        );
                }

                else if (
                    typeof date === 'string' ||
                    typeof date === 'number'
                ) {
                    date =
                        new Date(date);
                }

                if (
                    !(date instanceof Date) ||
                    isNaN(date.getTime())
                ) {
                    return '-';
                }

                return date.toLocaleString(
                    'fr-FR',
                    {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    }
                );

            } catch (error) {

                return '-';
            }
        }


        function formatDate(date) {

            if (!date) return '-';

            try {

                if (
                    date &&
                    typeof date.toDate === 'function'
                ) {
                    date = date.toDate();
                }

                else if (
                    date &&
                    typeof date.seconds === 'number'
                ) {
                    date =
                        new Date(
                            date.seconds * 1000
                        );
                }

                else if (
                    typeof date === 'string' ||
                    typeof date === 'number'
                ) {
                    date =
                        new Date(date);
                }

                if (
                    !(date instanceof Date) ||
                    isNaN(date.getTime())
                ) {
                    return '-';
                }

                return date.toLocaleDateString(
                    'fr-FR'
                );

            } catch (error) {

                return '-';
            }
        }


        function updateCacheStatus(
            status,
            message
        ) {

            const el =
                document.getElementById(
                    'cacheStatusText'
                );

            if (!el) return;

            const statusMap = {

                cached: '📦 Cache',

                live: '⚡ Temps réel',

                offline: '⚠️ Hors ligne',

                error: '❌ Erreur'

            };

            el.textContent =
                message ||
                statusMap[status] ||
                status;
        }


        // ================================================================
        // 6. NOTIFICATIONS - GESTIONNAIRE CENTRALISÉ
        // ================================================================

        async function enregistrerTokenFCM(
            etudiantId,
            etudiantNom,
            promotion
        ) {

            try {

                console.log(
                    '[FCM] 📱 Initialisation du gestionnaire centralisé...'
                );

                if (
                    !window.notificationManager
                ) {

                    console.warn(
                        '[FCM] ⚠️ NotificationManager pas encore disponible'
                    );

                    return null;
                }

                /*
                 * IMPORTANT :
                 *
                 * init() ne doit pas forcer la demande
                 * de permission au chargement de la page.
                 *
                 * Si l'autorisation a déjà été donnée,
                 * le gestionnaire peut récupérer/enregistrer
                 * le token.
                 */

                const token =
                    await window.notificationManager.init(
                        etudiantId,
                        etudiantNom,
                        promotion
                    );

                if (token) {

                    console.log(
                        '[FCM] ✅ Token disponible et enregistré'
                    );

                    const card =
                        document.getElementById(
                            'notificationPermissionCard'
                        );

                    if (card) {
                        card.classList.remove('show');
                    }

                } else {

                    console.log(
                        '[FCM] ℹ️ Aucun token disponible pour le moment'
                    );

        function checkNotificationStatus() {

            const card =
                document.getElementById(
                    'notificationPermissionCard'
                );

            if (!card) return;

            if (
                !('Notification' in window)
            ) {

                console.log(
                    '⚠️ API Notification non disponible'
                );

                card.classList.remove('show');

                return;
            }

            if (
                window.notificationManager &&
                typeof window.notificationManager.isActive ===
                'function'
            ) {

                try {

                    if (
                        window.notificationManager.isActive()
                    ) {

                        card.classList.remove('show');

                        return;
                    }

                } catch (error) {

                    console.warn(
                        '[FCM] Erreur vérification statut:',
                        error
                    );
                }
            }

            /*
             * Permission par défaut :
             * afficher le bouton Activer.
             */

            if (
                Notification.permission ===
                'default'
            ) {

                card.classList.add('show');

            } else {

                card.classList.remove('show');
            }
        }

        function getPromotionNom(
            promotionId
        ) {

            if (!promotionId) {
                return 'Non définie';
            }

            const promo =
                allPromotions.find(
                    p => p.id === promotionId
                );

            return promo
                ? promo.nom
                : promotionId;
        }


        // ================================================================
        // 10. GESTION DES COMMUNIQUÉS LUS
        // ================================================================

        function getReadCommuniques() {

            try {

                const data =
                    JSON.parse(
                        localStorage.getItem(
                            'communiques_lus'
                        ) || '[]'
                    );

                return Array.isArray(data)
                    ? data
                    : [];

            } catch (error) {

                console.warn(
                    '⚠️ Impossible de lire les communiqués lus:',
                    error
                );

                return [];
            }
        }


        function markAsRead(
            communiqueId
        ) {

            if (!communiqueId) return;

            const readIds =
                getReadCommuniques();

            if (
                !readIds.includes(
                    communiqueId
                )
            ) {

                readIds.push(
                    communiqueId
                );

                try {

                    localStorage.setItem(
                        'communiques_lus',
                        JSON.stringify(readIds)
                    );

                } catch (error) {

                    console.warn(
                        '⚠️ Impossible d’enregistrer la lecture:',
                        error
                    );
                }

                updateUnreadCount();
            }
        }


        function updateUnreadCount() {

            const readIds =
                getReadCommuniques();

            const unreadCount =
                allCommuniques.filter(
                    c => !readIds.includes(c.id)
                ).length;

            const dot =
                document.getElementById(
                    'notificationDot'
                );

            if (!dot) return;

            dot.style.display =
                unreadCount > 0
                    ? 'block'
                    : 'none';
        }

                            data-id="${escapeHtml(

                            onclick="handleCardClick('${escapeHtml(

        // ================================================================
        // 13. ÉCOUTEUR TEMPS RÉEL
        // ================================================================

        function setupRealtimeListener() {

            if (snapshotUnsubscribe) {

                try {
                    snapshotUnsubscribe();
                } catch (error) {}

                snapshotUnsubscribe =
                    null;
            }

            const maintenant =
                new Date();

            const promo =
                currentStudent
                    ? currentStudent.promotion
                    : null;

            console.log(
                '🔄 Écoute en temps réel des communiqués...'
            );

            /*
             * On récupère les communications dont
             * la date de fin est récente ou future.
             */

            snapshotUnsubscribe =
                db
                    .collection('communiques')
                    .where(
                        'dateFin',
                        '>=',
                        firebase.firestore.Timestamp.fromDate(
                            new Date(
                                maintenant.getTime() -
                                86400000
                            )
                        )
                    )
                    .orderBy(
                        'dateFin',
                        'asc'
                    )
                    .onSnapshot(

                        snapshot => {

                            console.log(
                                '📥 Snapshot reçu, taille:',
                                snapshot.size
                            );

                            const communiquesTemp =
                                [];

                            const nouveauxCommuniques =
                                [];

                            /*
                             * Détection des changements.
                             *
                             * IMPORTANT :
                             * aucun push n'est envoyé ici.
                             *
                             * Le push distant doit être envoyé
                             * par la Cloud Function.
                             */

                            snapshot
                                .docChanges()
                                .forEach(
                                    change => {

                                        const data =
                                            change.doc.data();

                                        const docId =
                                            change.doc.id;

                                        if (
                                            change.type ===
                                            'added'
                                        ) {

                                            const nouveau = {

                                                id: docId,

                                                ...data
                                            };

                                            /*
                                             * Pour éviter de considérer
                                             * tous les documents existants
                                             * comme de nouveaux communiqués
                                             * lors du premier chargement,
                                             * on ne déclenche le toast
                                             * que si la page avait déjà
                                             * reçu au moins une fois
                                             * les données.
                                             */

                                            if (
                                                allCommuniques.length > 0
                                            ) {

                                                nouveauxCommuniques
                                                    .push(
                                                        nouveau
                                                    );
                                            }

                                            console.log(
                                                '📢 COMMUNIQUÉ AJOUTÉ:',
                                                data.titre
                                            );
                                        }
                                    }
                                );


                            /*
                             * Construction de la liste.
                             */

                            snapshot.forEach(
                                doc => {

                                    const data =
                                        doc.data();

                                    /*
                                     * Filtrage par promotion.
                                     *
                                     * Si le communiqué ne possède
                                     * pas de promotions ou que la
                                     * liste est vide, il est visible
                                     * par tous.
                                     */

                                    if (
                                        data.promotions &&
                                        Array.isArray(
                                            data.promotions
                                        ) &&
                                        data.promotions.length > 0
                                    ) {

                                        if (
                                            !promo ||
                                            !data.promotions.includes(
                                                promo
                                            )
                                        ) {

                                            return;
                                        }
                                    }

                                    communiquesTemp.push({

                                        id: doc.id,

                                        titre:
                                            data.titre ||
                                            'Sans titre',

                                        description:
                                            data.description ||
                                            '',

                                        dateCreation:
                                            data.dateCreation ||
                                            null,

                                        dateFin:
                                            data.dateFin ||
                                            null,

                                        createur:
                                            data.createur ||
                                            ''
                                    });
                                }
                            );


                            /*
                             * Tri : plus récent en premier.
                             */

                            communiquesTemp.sort(
                                (a, b) => {

                                    let dateA = 0;
                                    let dateB = 0;

                                    if (
                                        a.dateCreation
                                    ) {

                                        if (
                                            typeof a.dateCreation.toDate ===
                                            'function'
                                        ) {

                                            dateA =
                                                a.dateCreation
                                                    .toDate()
                                                    .getTime();

                                        } else if (
                                            typeof a.dateCreation.seconds ===
                                            'number'
                                        ) {

                                            dateA =
                                                a.dateCreation.seconds *
                                                1000;
                                        }
                                    }

                                    if (
                                        b.dateCreation
                                    ) {

                                        if (
                                            typeof b.dateCreation.toDate ===
                                            'function'
                                        ) {

                                            dateB =
                                                b.dateCreation
                                                    .toDate()
                                                    .getTime();

                                        } else if (
                                            typeof b.dateCreation.seconds ===
                                            'number'
                                        ) {

                                            dateB =
                                                b.dateCreation.seconds *
                                                1000;
                                        }
                                    }

                                    return dateB - dateA;
                                }
                            );


                            /*
                             * Mise à jour globale.
                             */

                            allCommuniques =
                                communiquesTemp;


                            /*
                             * Notification visuelle uniquement
                             * pour les nouveaux communiqués.
                             */

                            if (
                                nouveauxCommuniques.length > 0
                            ) {

                                nouveauxCommuniques
                                    .forEach(
                                        comm => {

                                            const titre =
                                                comm.titre ||
                                                'Nouveau communiqué';

                                            showToast(
                                                `📢 ${titre}`,
                                                'info'
                                            );

                                            /*
                                             * Le point rouge indique
                                             * qu'un nouveau communiqué
                                             * n'a pas encore été lu.
                                             */

                                            const dot =
                                                document.getElementById(
                                                    'notificationDot'
                                                );

                                            if (dot) {
                                                dot.style.display =
                                                    'block';
                                            }

                                            /*
                                             * Petit son local optionnel.
                                             *
                                             * Aucun push n'est envoyé
                                             * depuis le navigateur.
                                             */

                                            try {

                                                const audio =
                                                    new Audio();

                                                audio.src =
                                                    'data:audio/wav;base64,U3RlYWx0aCBzb3VuZA==';

                                                audio.volume =
                                                    0.3;

                                                audio
                                                    .play()
                                                    .catch(
                                                        () => {}
                                                    );

                                            } catch (error) {}

                                        }
                                    );
                            }


                            renderCommuniques(
                                false
                            );

                        },

                        error => {

                            console.error(
                                '❌ Erreur listener:',
                                error
                            );

                            updateCacheStatus(
                                'offline',
                                '⚠️ Hors ligne'
                            );

                            /*
                             * Firestore possède son propre cache
                             * hors ligne. On essaie donc de garder
                             * les données déjà présentes.
                             */

                            if (
                                allCommuniques.length > 0
                            ) {

                                renderCommuniques(
                                    true
                                );

                            } else {

                                const container =
                                    document.getElementById(
                                        'contentCard'
                                    );

                                if (container) {

                                    container.innerHTML = `

                                        <div class="empty-state">

                                            <i class="bi bi-wifi-off"></i>

                                            <h5>
                                                Connexion indisponible
                                            </h5>

                                            <p class="text-muted">
                                                Impossible de récupérer les communications pour le moment.
                                            </p>

                                            <button
                                                class="btn-back"
                                                onclick="location.reload()"
                                            >
                                                <i class="bi bi-arrow-clockwise"></i>
                                                Réessayer
                                            </button>

                                        </div>
                                    `;
                                }
                            }
                        }
                    );
        }

        async function registerServiceWorker() {

            if (
                !('serviceWorker' in navigator)
            ) {

                console.warn(
                    '⚠️ Service Worker non supporté'
                );

                return null;
            }

            try {

                /*
                 * Utiliser le gestionnaire centralisé
                 * lorsqu'il est disponible.
                 */

                if (
                    window.registerAppServiceWorker &&
                    typeof window.registerAppServiceWorker ===
                    'function'
                ) {

                    const registration =
                        await window.registerAppServiceWorker();

                    if (registration) {

                        console.log(
                            '✅ SW centralisé:',
                            registration.scope
                        );
                    }

                    return registration;
                }


                /*
                 * Fallback :
                 * enregistrer directement sw.js.
                 */

                let registration =
                    await navigator
                        .serviceWorker
                        .getRegistration(
                            '/Espace-etudiant/'
                        );

                if (!registration) {

                    registration =
                        await navigator
                            .serviceWorker
                            .register(
                                './sw.js',
                                {
                                    scope:
                                        '/Espace-etudiant/'
                                }
                            );
                }

                console.log(
                    '✅ SW principal:',
                    registration.scope
                );

                return registration;

            } catch (error) {

                console.error(
                    '❌ Erreur SW:',
                    error
                );

                return null;
            }
        }


        // ================================================================

        function setupOfflineDetection() {

            const offlineBadge =
                document.getElementById(
                    'offlineBadge'
                );

            if (!offlineBadge) return;

            function updateStatus() {

                if (!navigator.onLine) {

                    offlineBadge.classList.add(
                        'show'
                    );

                    updateCacheStatus(
                        'offline'
                    );

                } else {

                    offlineBadge.classList.remove(
                        'show'
                    );

                    /*
                     * Ne pas remplacer inutilement
                     * le statut temps réel.
                     */

                    if (
                        allCommuniques.length > 0
                    ) {

                        updateCacheStatus(
                            'live',
                            '⚡ Temps réel (' +
                            allCommuniques.length +
                            ' comm.)'
                        );

                    } else {

                        updateCacheStatus(
                            'live'
                        );
                    }
                }
            }

            window.addEventListener(
                'online',
                updateStatus
            );

            window.addEventListener(
                'offline',
                updateStatus
            );

            updateStatus();
        }


        // ================================================================
        // 21. INITIALISATION NOTIFICATIONS
        // ================================================================

        async function initialiserNotifications() {

            try {

                /*
                 * Attendre brièvement que notification-utils.js
                 * ait terminé son chargement si nécessaire.
                 */

                let tentatives = 0;

                while (
                    !window.notificationManager &&
                    tentatives < 50
                ) {

                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                100
                            )
                    );

                    tentatives++;
                }


                if (
                    !window.notificationManager
                ) {

                    console.warn(
                        '⚠️ NotificationManager indisponible'
                    );

                    checkNotificationStatus();

                    return;
                }


                /*
                 * Initialisation silencieuse.
                 *
                 * La permission n'est pas demandée ici.
                 */

                await window
                    .notificationManager
                    .init(
                        currentStudent.id,
                        currentStudent.nom,
                        currentStudent.promotion
                    );

                console.log(
                    '✅ NotificationManager initialisé'
                );

                checkNotificationStatus();

            } catch (error) {

                console.error(
                    '❌ Initialisation notifications:',
                    error
                );

                checkNotificationStatus();
            }
        }


        // ================================================================
        // 22. INITIALISATION PRINCIPALE
        // ================================================================

        async function init() {

            if (!checkSession()) {
                return;
            }

            console.log(
                '🚀 Communiquer - Démarrage'
            );

            console.log(
                '👤 Étudiant:',
                currentStudent.nom
            );

            console.log(
                '🆔 ID:',
                currentStudent.id
            );

            console.log(
                '⚡ Écoute en temps réel activée'
            );


            /*
             * Charger les promotions.
             */

            await chargerPromotions();


            /*
             * Enregistrer le SW centralisé.
             */

            await registerServiceWorker();


            /*
             * Initialiser les notifications
             * sans demander automatiquement
             * la permission.
             */

            await initialiserNotifications();


            /*
             * Écouter Firestore.
             */

            setupRealtimeListener();


            /*
             * Détection hors ligne.
             */

            setupOfflineDetection();


            /*
             * Vérification du bouton notifications.
             */

            checkNotificationStatus();


            /*
             * Vérifier si un communiqué précis
             * doit être ouvert.
             */

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const communiqueId =
                params.get('communique') ||
                params.get('id');


            if (communiqueId) {

                setTimeout(
                    () => {

                        const card =
                            document.querySelector(
                                `.communique-card[data-id="${CSS.escape(communiqueId)}"]`
                            );

                        if (card) {

                            card.scrollIntoView({
                                behavior:
                                    'smooth',
                                block:
                                    'center'
                            });

                            handleCardClick(
                                communiqueId
                            );

                        }

                    },
                    1000
                );
            }


            console.log(
                '✅ Communiquer prêt - Temps réel + Cache actifs'
            );


            if (
                window.notificationManager &&
                typeof window.notificationManager.isActive ===
                'function'
            ) {

                try {

                    console.log(
                        '🔔 NotificationManager actif:',
                        window
                            .notificationManager
                            .isActive()
                    );

                } catch (error) {

                    console.warn(
                        '⚠️ Impossible de vérifier NotificationManager'
                    );
                }
            }
        }


        // ================================================================
        // 23. NETTOYAGE
        // ================================================================

        window.addEventListener(
            'beforeunload',
            function () {

                if (snapshotUnsubscribe) {

                    try {
                        snapshotUnsubscribe();
                    } catch (error) {}

                    snapshotUnsubscribe =
                        null;
                }
            }
        );


        // ================================================================
        // 24. DÉMARRAGE
        // ================================================================

        init();


        // ================================================================
        // 25. LOGS CONSOLE
        // ================================================================

        console.log(
            '%c📢 COMMUNIQUÉS EN TEMPS RÉEL',
            'color: #ffb347; font-size: 14px; font-weight: bold;'
        );

        console.log(
            '%c⚡ Les communiqués arrivent instantanément !',
            'color: #28a745; font-size: 12px;'
        );

        console.log(
            '%c🔔 Notifications gérées par le système centralisé',
            'color: #17a2b8; font-size: 12px;'
        );

        console.log(
            '%c🔧 Service Worker utilisé: sw.js',
            'color: #003366; font-size: 12px; font-weight: bold;'
        );

        console.log(
            '%c🚫 Aucun firebase-messaging-sw.js utilisé par cette page',
            'color: #dc3545; font-size: 12px;'
        );

    </script>

</body>
