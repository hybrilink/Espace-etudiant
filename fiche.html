function data(){

/* ====== PALETTE ====== */
const C={
  blue:"#0b3d91", dark:"#062a6b", gold:"#c9a227", goldSoft:"#e6c866",
  text:"#1e1e1e", gray:"#5a6b85", line:"#d8dde6", paper:"#fdfcf7"

const S=1240,H=1754,SCALE=2;

function ctx(){
 const c=document.getElementById("docCanvas").getContext("2d");
 c.setTransform(1,0,0,1,0,0);
 c.scale(SCALE,SCALE);
 c.imageSmoothingEnabled=true;

/* ====== PRIMITIVES ====== */
function text(c,t,x,y,size=12,bold=false,align="left",color=C.text){
 c.font=`${bold?"700 ":"400 "}${size}px Georgia, "Times New Roman", serif`;
 c.fillStyle=color;c.textAlign=align;c.textBaseline="alphabetic";c.fillText(t,x,y);
}
function wrap(c,t,x,y,max,size=12,bold=false,lh=18,color=C.text){
 c.font=`${bold?"700 ":"400 "}${size}px Georgia, "Times New Roman", serif`;
 c.fillStyle=color;
 const words=t.split(/\s+/);let line="";
 for(const w of words){
   const test=line?line+" "+w:w;
   if(c.measureText(test).width>max&&line){text(c,line,x,y,size,bold,"left",color);y+=lh;line=w}
   else line=test;
 }
 if(line){text(c,line,x,y,size,bold,"left",color);y+=lh}
 return y;
}

/* ====== TEXTURES ====== */
function paperTexture(c){
  c.fillStyle=C.paper;c.fillRect(0,0,S,H);
  for(let i=0;i<900;i++){
    const x=Math.random()*S,y=Math.random()*H;
    c.fillStyle=`rgba(${180+Math.random()*40|0},${170+Math.random()*40|0},${140+Math.random()*40|0},0.035)`;
    c.fillRect(x,y,1,1);
  }
  const grad=c.createRadialGradient(S/2,H/2,S*0.25,S/2,H/2,S*0.85);
  grad.addColorStop(0,"rgba(0,0,0,0)");
  grad.addColorStop(1,"rgba(60,50,30,0.06)");
  c.fillStyle=grad;c.fillRect(0,0,S,H);

  c.strokeStyle="rgba(11,61,145,0.35)";c.lineWidth=1.5;
  c.strokeRect(14,14,S-28,H-28);
  c.strokeStyle="rgba(201,162,39,0.55)";c.lineWidth=2;
  c.strokeRect(22,22,S-44,H-44);
}
function watermark(c){
  c.save();
  c.translate(S/2,H/2);c.rotate(-Math.PI/9);
  c.font="700 88px Georgia, serif";
  c.fillStyle="rgba(11,61,145,0.045)";

}

function dottedLine(c,x1,x2,y){

/* ====== QR CODE ====== */
/* On génère un QR code "hors-écran" via qrcodejs, puis on le dessine sur le canvas. */
function generateQR(text,size=180){
  return new Promise(resolve=>{
    const holder=document.createElement("div");
    holder.style.position="absolute";
    holder.style.left="-9999px";
    document.body.appendChild(holder);
    new QRCode(holder,{
      text:text,
      width:size,
      height:size,
      colorDark:"#062a6b",
      colorLight:"#ffffff",
      correctLevel:QRCode.CorrectLevel.M
    });
    // qrcodejs dessine soit un canvas, soit une img
    setTimeout(()=>{
      const el=holder.querySelector("canvas")||holder.querySelector("img");
      if(!el){ holder.remove(); resolve(null); return; }
      if(el.tagName==="CANVAS"){
        holder.remove();
        resolve(el);
      }else{
        // c'est une <img>, on la convertit en canvas
        const cnv=document.createElement("canvas");
        cnv.width=size;cnv.height=size;
        const cx=cnv.getContext("2d");
        const img=new Image();
        img.onload=()=>{ cx.drawImage(img,0,0,size,size); holder.remove(); resolve(cnv); };
        img.onerror=()=>{ holder.remove(); resolve(null); };
        img.src=el.src;
      }
    },80);
  });
}
let qrCanvas=null;      // cache du QR code rendu pour le document courant
let qrKey="";           // clé de cache (étudiant + doc)

async function ensureQR(d){
  const key=`${currentDoc}|${d.matricule}|${d.nom}`;
  if(qrCanvas && qrKey===key) return qrCanvas;
  const payload=`FSA-UNILU|${currentDoc}|${d.nom}|${d.matricule}|${d.annee}`;
  qrCanvas=await generateQR(payload,180);
  qrKey=key;
  return qrCanvas;
}

/* ====== EN-TÊTE (fidèle à l'original) ====== */
function header(c,title){
  text(c,"FACULTÉ DES SCIENCES AGRONOMIQUES",205,42,14,true,"center",C.dark);
  text(c,"DE L'UNIVERSITÉ DE LUBUMBASHI",205,62,14,true,"center",C.dark);
  text(c,"Lubumbashi, Haut-Katanga, RDC",205,82,9,false,"center",C.gray);

if(logoReady){
  try{
    const x=560, y=28, w=120, h=90;
    const cx = x + w/2;              // centre X
    const cy = y + h/2;              // centre Y
    const r  = Math.max(w,h)/2;      // rayon

    // 1) Découpe circulaire + dessin du logo
    c.save();
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI*2);
    c.closePath();
    c.clip();
    c.drawImage(LOGO, x, y, w, h);
    c.restore();

    // 2) Contour doré élégant autour du cercle
    c.save();
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI*2);
    c.strokeStyle = "#c9a227";   // or
    c.lineWidth = 3;
    c.stroke();
    c.restore();
  }catch(e){}
}
  c.lineWidth=4;c.strokeStyle=C.blue;
  c.beginPath();
  c.moveTo(18,103);c.lineTo(515,103);
  c.moveTo(725,103);c.lineTo(1222,103);
  c.stroke();

  text(c,title,S/2,145,27,true,"center",C.dark);

  const tw=c.measureText(title).width;
  c.strokeStyle=C.gold;c.lineWidth=1.5;
  c.beginPath();c.moveTo(S/2-tw/2-10,151);c.lineTo(S/2+tw/2+10,151);c.stroke();
}

/* ====== PIED DE PAGE (remonté + QR code) ====== */
function footer(c,d){

  c.strokeStyle="rgba(90,107,133,0.4)";c.lineWidth=1;

  c.font="italic 11px Georgia, serif";
  c.fillStyle=C.gray;

  /* ----- Doyen (droite) ----- */
  c.fillStyle=C.dark;
  c.font="400 12px Georgia, serif";
  c.fillText("Le Doyen de la Faculté",940,H-150);

  c.strokeStyle="rgba(90,107,133,0.4)";c.lineWidth=1;
  c.beginPath();c.moveTo(800,H-105);c.lineTo(1080,H-105);c.stroke();
  c.font="700 13px Georgia, serif";
  c.fillStyle=C.dark;
  c.fillText("Michel MPUNDU",940,H-88);

  /* ----- QR code (centre) ----- */
  const qrX=S/2-40, qrY=H-165, qrSize=80;
  if(qrCanvas){
    try{ c.drawImage(qrCanvas,qrX,qrY,qrSize,qrSize); }catch(e){}
  }
  // cadre fin autour du QR
  c.strokeStyle="rgba(11,61,145,0.35)";c.lineWidth=1;
  c.strokeRect(qrX,qrY,qrSize,qrSize);
  // légende sous le QR
  c.fillStyle=C.gray;
  c.font="400 8px Georgia, serif";
  c.textAlign="center";
  c.fillText("Scannez pour vérifier",S/2,H-70);

  /* ----- Mention légale (très bas mais dans la page) ----- */
  c.font="400 8px Georgia, serif";
  c.fillStyle=C.gray;
  c.textAlign="center";
  c.fillText("DÉCRET N°06/0106 DU 12 JUIN 2006",S/2,H-30);
}

async function drawAttestation(){

/* ====== RENDER ====== */
async function render(kind){
 currentDoc=kind;
 const titles={
   attestation:"Attestation de recherche",
   acceptation:"Note d’acceptation de stage",
   recommandation:"Recommandation de stage",
   recours:"Formulaire de recours"
 };
 document.getElementById("viewerTitle").textContent=titles[kind];
 const fns={attestation:drawAttestation,acceptation:drawAcceptation,recommandation:drawRecommandation,recours:drawRecours};
 await fns[kind]();
 document.getElementById("viewer").classList.add("show");
}

document.querySelectorAll(".doc-btn").forEach(b=>b.addEventListener("click",()=>render(b.dataset.doc)));
document.getElementById("close").onclick=()=>document.getElementById("viewer").classList.remove("show");

/* ====== IMPRESSION ====== */
document.getElementById("print").onclick=()=>{
  const canvas=document.getElementById("docCanvas");
  const dataUrl=canvas.toDataURL("image/png");
  const w=window.open("","_blank","width=900,height=1200");
  if(!w){ window.print(); return; }
  w.document.write(`
    <html><head><title>Impression</title>
    <style>
      @page{size:A4 portrait;margin:0}
      html,body{margin:0;padding:0;background:#fff}
      img{width:210mm;height:297mm;display:block;margin:0 auto;page-break-after:avoid}
    </style></head>
    <body><img src="${dataUrl}" onload="window.focus();window.print();setTimeout(()=>window.close(),400);"></body>
    </html>`);
  w.document.close();
};

/* ====== PDF ====== */
document.getElementById("download").onclick=()=>{
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
 pdf.addImage(document.getElementById("docCanvas").toDataURL("image/jpeg",.96),"JPEG",0,0,210,297);
 const names={attestation:"attestation_recherche",acceptation:"note_acceptation_stage",recommandation:"recommandation_stage",recours:"formulaire_recours"};
 pdf.save(names[currentDoc]+".pdf");
};

document.getElementById("logout").onclick=()=>{localStorage.removeItem(sessionKey);location.href="login-etudiant.html"};
loadStudent();
