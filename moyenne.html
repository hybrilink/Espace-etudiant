    <script>

        // ================================================================
        // 2. VARIABLES
        // ================================================================

        let currentStudent = null;
        let allCotations = [];
        let allPromotions = [];
        let unsubscribe = null;

        // ================================================================
        // 3. SESSION ÉTUDIANT
        // ================================================================

        function checkSession() {

            const session = localStorage.getItem('session_etudiant');

            if (!session) {

                window.location.href = 'login-etudiant.html';

                return false;
            }

            try {

                const data = JSON.parse(session);

                if (!data || !data.expires) {

                    localStorage.removeItem('session_etudiant');

                    window.location.href = 'login-etudiant.html';

                    return false;
                }

                if (Date.now() > data.expires) {

                    localStorage.removeItem('session_etudiant');

                    window.location.href = 'login-etudiant.html';

                    return false;
                }

                if (!data.id) {

                    localStorage.removeItem('session_etudiant');

                    window.location.href = 'login-etudiant.html';

                    return false;
                }

                currentStudent = data;

                return true;

            } catch (error) {

                console.error(
                    '[SESSION] Session invalide:',
                    error
                );

                localStorage.removeItem('session_etudiant');

                window.location.href = 'login-etudiant.html';

                return false;
            }
        }

        // ================================================================
        // 4. TOAST
        // ================================================================

        function showToast(message, type = 'success') {

            const container =
                document.getElementById('toastContainer');

            if (!container) return;

            const toast =
                document.createElement('div');

            toast.className = 'toast-custom';

            const colors = {

                success: {
                    bg: '#28a745',
                    icon: 'bi-check-circle-fill'
                },

                warning: {
                    bg: '#ffc107',
                    icon: 'bi-exclamation-triangle-fill',
                    textColor: '#333'
                },

                danger: {
                    bg: '#dc3545',
                    icon: 'bi-x-circle-fill'
                },

                info: {
                    bg: '#17a2b8',
                    icon: 'bi-info-circle-fill'
                }

            };

            const config =
                colors[type] || colors.success;

            const textColor =
                config.textColor || 'white';

            toast.style.background = config.bg;
            toast.style.color = textColor;

            const icon =
                document.createElement('i');

            icon.className =
                `bi ${config.icon}`;

            const span =
                document.createElement('span');

            span.textContent = message;

            const close =
                document.createElement('button');

            close.className = 'close-toast';
            close.innerHTML = '&times;';
            close.setAttribute('aria-label', 'Fermer');

            close.addEventListener('click', () => {
                toast.remove();
            });

            toast.appendChild(icon);
            toast.appendChild(span);
            toast.appendChild(close);

            container.prepend(toast);

            setTimeout(() => {

                if (toast.parentNode) {
                    toast.remove();
                }

            }, 5000);
        }

        // ================================================================
        // 5. ESCAPE HTML
        // ================================================================

        function escapeHtml(text) {

            if (
                text === undefined ||
                text === null
            ) {
                return '';
            }

            const div =
                document.createElement('div');

            div.textContent = String(text);

            return div.innerHTML;
        }

        // ================================================================
        // 6. STATUT DU CACHE
        // ================================================================

        function updateCacheStatus(
            status,
            message
        ) {

            const el =
                document.getElementById(
                    'cacheStatusText'
                );

            if (!el) return;

            const statusMap = {

                cached: '📦 Cache',

                live: '🔄 Temps réel',

                offline: '⚠️ Hors ligne',

                error: '❌ Erreur'
            };

            el.textContent =
                message ||
                statusMap[status] ||
                status;
        }

        // ================================================================
        // 7. NOTIFICATIONS CENTRALISÉES
        // ================================================================

        async function initialiserNotifications() {

            try {

                if (
                    !window.notificationManager ||
                    typeof window.notificationManager.init !== 'function'
                ) {

                    console.warn(
                        '[NOTIFICATIONS] notificationManager indisponible.'
                    );

                    return;
                }

                await window.notificationManager.init(

                    currentStudent.id,

                    currentStudent.nom || '',

                    currentStudent.promotion || ''

                );

                console.log(
                    '[NOTIFICATIONS] ✅ Gestionnaire initialisé.'
                );

                mettreAJourEtatNotification();

            } catch (error) {

                console.error(
                    '[NOTIFICATIONS] Erreur initialisation:',
                    error
                );
            }
        }

        // ================================================================
        // 8. ÉTAT DES NOTIFICATIONS
        // ================================================================

        function mettreAJourEtatNotification() {

            const card =
                document.getElementById(
                    'notificationPermissionCard'
                );

            if (!card) return;

            if (!('Notification' in window)) {

                card.classList.remove('show');

                return;
            }

            if (Notification.permission === 'granted') {

                card.classList.remove('show');

                return;
            }

            if (Notification.permission === 'denied') {

                card.classList.remove('show');

                return;
            }

            /*
             * Permission "default".
             * La carte peut être affichée pour permettre
             * à l'étudiant d'activer explicitement les notifications.
             */

            card.classList.add('show');
        }

        // ================================================================
        // 9. BOUTON ACTIVER NOTIFICATIONS
        // ================================================================

        document
            .getElementById('enableNotificationsBtn')
            ?.addEventListener(
                'click',
                async function() {

                    if (!currentStudent) {
                        return;
                    }

                    const btn =
                        document.getElementById(
                            'enableNotificationsBtn'
                        );

                    if (!btn) return;

                    btn.disabled = true;

                    btn.innerHTML =
                        '<span class="spinner-border spinner-border-sm me-1"></span> Activation...';

                    try {

                        if (
                            !window.notificationManager ||
                            typeof window.notificationManager
                                .requestPermissionAndRegister !== 'function'
                        ) {

                            throw new Error(
                                'Gestionnaire de notifications indisponible.'
                            );
                        }

                        const token =
                            await window
                                .notificationManager
                                .requestPermissionAndRegister();

                        if (token) {

                            showToast(
                                '🔔 Notifications activées !',
                                'success'
                            );

                        } else {

                            if (
                                'Notification' in window &&
                                Notification.permission === 'denied'
                            ) {

                                showToast(
                                    '⚠️ Notifications bloquées. Autorisez-les dans les réglages du navigateur.',
                                    'warning'
                                );

                            } else {

                                showToast(
                                    '⚠️ Impossible d’activer les notifications.',
                                    'warning'
                                );
                            }
                        }

                    } catch (error) {

                        console.error(
                            '[NOTIFICATIONS] Erreur:',
                            error
                        );

                        showToast(
                            '⚠️ Erreur lors de l’activation des notifications.',
                            'warning'
                        );

                    } finally {

                        btn.disabled = false;

                        btn.innerHTML =
                            '<i class="bi bi-bell"></i> Activer';

                        mettreAJourEtatNotification();
                    }

                }
            );

        // ================================================================
        // 10. PROMOTIONS
        // ================================================================

        async function chargerPromotions(
            forceRefresh = false
        ) {

            try {

                const snapshot =
                    await db
                        .collection('promotions')
                        .get();

                allPromotions = [];

                snapshot.forEach(doc => {

                    allPromotions.push({

                        id: doc.id,

                        ...doc.data()

                    });

                });

                return allPromotions;

            } catch (error) {

                console.error(
                    '[PROMOTIONS] Erreur:',
                    error
                );

                return [];
            }
        }

        // ================================================================
        // 11. NOM PROMOTION
        // ================================================================

        function getPromotionNom(
            promotionId
        ) {

            if (!promotionId) {
                return 'Non définie';
            }

            const promo =
                allPromotions.find(
                    p => p.id === promotionId
                );

            return promo
                ? promo.nom
                : promotionId;
        }

        // ================================================================
        // 12. VÉRIFICATION RÉUSSITE
        // ================================================================

        function estReussite(valeur) {

            if (
                valeur === undefined ||
                valeur === null ||
                isNaN(valeur)
            ) {

                return false;
            }

            return Number(valeur) >= 5;
        }

        // ================================================================
        // 13. NOTE SIMPLE
        // ================================================================

        function getNoteSimple(valeur) {

            if (
                valeur === undefined ||
                valeur === null ||
                valeur === '' ||
                isNaN(valeur)
            ) {

                return `
                    <span
                        class="note-simple"
                        style="opacity:0.3;"
                    >-</span>
                `;
            }

            const nombre =
                Number(valeur);

            return `
                <span class="note-simple">
                    ${nombre.toFixed(1)}
                </span>
            `;
        }

        // ================================================================
        // 14. BADGE MOYENNE
        // ================================================================

        function getMoyenneBadge(valeur) {

            if (
                valeur === undefined ||
                valeur === null ||
                valeur === '' ||
                isNaN(valeur)
            ) {

                return `
                    <span
                        class="moyenne-badge"
                        style="
                            opacity:0.3;
                            background:#ccc;
                            color:white;
                        "
                    >-</span>
                `;
            }

            const nombre =
                Number(valeur);

            const reussite =
                estReussite(nombre);

            const classe =
                reussite
                    ? 'reussite'
                    : 'echec';

            return `
                <span class="moyenne-badge ${classe}">
                    ${nombre.toFixed(1)}
                </span>
            `;
        }

        // ================================================================
        // 15. AFFICHAGE DES NOTES
        // ================================================================

        function afficherNotes(
            fromCache = false
        ) {

            const container =
                document.getElementById(
                    'notesContainer'
                );

            const stat =
                document.getElementById(
                    'statCoursEvalues'
                );

            if (!container) return;

            if (stat) {
                stat.textContent =
                    allCotations.length;
            }

            if (allCotations.length === 0) {

                container.innerHTML = `

                    <div class="empty-state">

                        <i class="bi bi-journal-x"></i>

                        <h5>
                            Aucune note disponible
                        </h5>

                        <p>
                            Vos notes apparaîtront ici
                            dès que vos professeurs
                            les publieront.
                        </p>

                        ${
                            fromCache
                                ? `
                                    <p class="text-muted small">
                                        <i class="bi bi-database"></i>
                                        Données en cache
                                    </p>
                                `
                                : ''
                        }

                    </div>
                `;

                return;
            }

            const totalMoyenne =
                allCotations.reduce(
                    (s, c) =>
                        s +
                        (
                            Number(c.moyenne) || 0
                        ),
                    0
                );

            const moyenneGenerale =
                allCotations.length > 0
                    ? totalMoyenne /
                      allCotations.length
                    : 0;

            let html = `

                <div class="table-responsive">

                    <table class="notes-table">

                        <thead>

                            <tr>

                                <th style="width:40px;">
                                    N°
                                </th>

                                <th>
                                    Cours
                                </th>

                                <th style="width:80px;">
                                    Présence /2
                                </th>

                                <th style="width:60px;">
                                    TD /2
                                </th>

                                <th style="width:60px;">
                                    TP /2
                                </th>

                                <th style="width:80px;">
                                    Interro /4
                                </th>

                                <th style="width:80px;">
                                    Moyenne /10
                                </th>

                            </tr>

                        </thead>

                        <tbody>
            `;

            allCotations.forEach(
                (c, i) => {

                    const moyenne =
                        Number(c.moyenne) || 0;

                    const presence =
                        Number(c.presence) || 0;

                    const td =
                        Number(c.td) || 0;

                    const tp =
                        Number(c.tp) || 0;

                    const interro =
                        Number(c.interro) || 0;

                    html += `

                        <tr>

                            <td
                                style="
                                    text-align:center;
                                    color:#888;
                                    font-weight:bold;
                                "
                            >
                                ${i + 1}
                            </td>

                            <td class="cours-nom-cell">

                                <i class="bi bi-book-fill"></i>

                                ${escapeHtml(
                                    c.coursNom ||
                                    'Cours'
                                )}

                            </td>

                            <td>
                                ${getNoteSimple(
                                    presence
                                )}
                            </td>

                            <td>
                                ${getNoteSimple(
                                    td
                                )}
                            </td>

                            <td>
                                ${getNoteSimple(
                                    tp
                                )}
                            </td>

                            <td>
                                ${getNoteSimple(
                                    interro
                                )}
                            </td>

                            <td>
                                ${getMoyenneBadge(
                                    moyenne
                                )}
                            </td>

                        </tr>
                    `;
                }
            );

            const moyenneGenClasse =
                moyenneGenerale >= 5
                    ? 'reussite'
                    : 'echec';

            html += `

                        </tbody>

                        <tfoot>

                            <tr>

                                <td
                                    colspan="6"
                                    style="
                                        text-align:right;
                                        font-weight:bold;
                                        color:var(--primary-blue);
                                    "
                                >

                                    <i class="bi bi-calculator-fill"></i>

                                    Moyenne Générale

                                </td>

                                <td>

                                    <span
                                        class="
                                            moyenne-generale-badge
                                            ${moyenneGenClasse}
                                        "
                                    >
                                        ${moyenneGenerale.toFixed(2)}
                                    </span>

                                </td>

                            </tr>

                        </tfoot>

                    </table>

                </div>
            `;

            container.innerHTML = html;

            if (fromCache) {

                updateCacheStatus(
                    'cached'
                );

            } else {

                updateCacheStatus(
                    'live',
                    '🔄 Temps réel (' +
                    allCotations.length +
                    ' notes)'
                );
            }
        }

        // ================================================================
        // 16. CONVERSION DATE FIRESTORE
        // ================================================================

        function getTimestampMillis(
            value
        ) {

            if (!value) {
                return 0;
            }

            try {

                if (
                    typeof value.toDate === 'function'
                ) {

                    return value
                        .toDate()
                        .getTime();
                }

                if (
                    typeof value.toMillis === 'function'
                ) {

                    return value.toMillis();
                }

                if (
                    value.seconds !== undefined
                ) {

                    return Number(value.seconds) *
                        1000;
                }

                if (
                    value._seconds !== undefined
                ) {

                    return Number(value._seconds) *
                        1000;
                }

                if (
                    typeof value === 'string'
                ) {

                    const time =
                        new Date(value)
                            .getTime();

                    return isNaN(time)
                        ? 0
                        : time;
                }

                if (
                    typeof value === 'number'
                ) {

                    return value;
                }

            } catch (error) {

                console.warn(
                    '[DATE] Conversion impossible:',
                    error
                );
            }

            return 0;
        }

        // ================================================================
        // 17. ÉCOUTEUR TEMPS RÉEL
        // ================================================================

        function setupRealtimeListener() {

            if (unsubscribe) {

                try {
                    unsubscribe();
                } catch (e) {}

                unsubscribe = null;
            }

            if (
                !currentStudent ||
                !currentStudent.id
            ) {

                console.error(
                    '[NOTES] ID étudiant manquant.'
                );

                return;
            }

            console.log(
                '🔄 Écoute en temps réel des notes...'
            );

            unsubscribe =
                db
                    .collection('cotations')
                    .where(
                        'etudiantId',
                        '==',
                        currentStudent.id
                    )
                    .onSnapshot(

                        snapshot => {

                            console.log(
                                '📥 Snapshot reçu, taille:',
                                snapshot.size
                            );

                            const cotationsTemp = [];

                            const nouvellesNotes = [];

                            snapshot.docChanges()
                                .forEach(change => {

                                    /*
                                     * IMPORTANT :
                                     * Une modification d'une note
                                     * ne doit pas déclencher une
                                     * notification comme une nouvelle
                                     * note.
                                     */

                                    if (
                                        change.type === 'added'
                                    ) {

                                        const data =
                                            change.doc.data();

                                        const nouvelle = {

                                            id: change.doc.id,

                                            ...data

                                        };

                                        nouvellesNotes
                                            .push(
                                                nouvelle
                                            );

                                        console.log(
                                            '📝 NOTE AJOUTÉE:',
                                            data.coursNom,
                                            data.moyenne
                                        );
                                    }

                                });

                            snapshot.forEach(doc => {

                                const data =
                                    doc.data();

                                cotationsTemp.push({

                                    id: doc.id,

                                    coursNom:
                                        data.coursNom ||
                                        'Sans titre',

                                    presence:
                                        data.presence ??
                                        0,

                                    td:
                                        data.td ??
                                        0,

                                    tp:
                                        data.tp ??
                                        0,

                                    interro:
                                        data.interro ??
                                        0,

                                    moyenne:
                                        data.moyenne ??
                                        0,

                                    dateCreation:
                                        data.dateCreation,

                                    createur:
                                        data.createur ||
                                        ''

                                });

                            });

                            cotationsTemp.sort(
                                (a, b) => {

                                    const dateA =
                                        getTimestampMillis(
                                            a.dateCreation
                                        );

                                    const dateB =
                                        getTimestampMillis(
                                            b.dateCreation
                                        );

                                    return dateB -
                                        dateA;
                                }
                            );

                            allCotations =
                                cotationsTemp;

                            /*
                             * Afficher immédiatement les notes.
                             */

                            afficherNotes(false);

                            /*
                             * Les notifications push sont désormais
                             * gérées par notification-utils.js + sw.js.
                             *
                             * On NE fait donc plus :
                             *
                             * envoyerNotificationPush(...)
                             *
                             * depuis cette page.
                             */

                            if (
                                nouvellesNotes.length > 0
                            ) {

                                nouvellesNotes.forEach(
                                    note => {

                                        const coursNom =
                                            note.coursNom ||
                                            'Cours';

                                        const moyenne =
                                            Number(
                                                note.moyenne
                                            ) || 0;

                                        const noteAffichee =
                                            moyenne.toFixed(1);

                                        /*
                                         * Notification visuelle
                                         * uniquement lorsque l'application
                                         * est actuellement ouverte.
                                         *
                                         * Le vrai Push en arrière-plan
                                         * est géré côté serveur + sw.js.
                                         */

                                        showToast(
                                            `📝 ${coursNom} : ${noteAffichee}/10`,
                                            'info'
                                        );

                                        /*
                                         * Petit signal visuel.
                                         */

                                        const dot =
                                            document.getElementById(
                                                'notificationDot'
                                            );

                                        if (dot) {

                                            dot.style.display =
                                                'block';

                                            setTimeout(
                                                () => {

                                                    dot.style.display =
                                                        'none';

                                                },
                                                6000
                                            );
                                        }

                                    }
                                );
                            }

                        },

                        error => {

                            console.error(
                                '❌ Erreur listener:',
                                error
                            );

                            updateCacheStatus(
                                'offline',
                                '⚠️ Hors ligne'
                            );

                            /*
                             * Firestore peut encore fournir des
                             * données en cache selon la configuration.
                             */
                        }
                    );
        }

        // ================================================================
        // 18. PROFIL
        // ================================================================

        async function loadProfileData() {

            await chargerPromotions();

            const promoNom =
                getPromotionNom(
                    currentStudent.promotion
                );

            const profilNom =
                document.getElementById(
                    'profilNom'
                );

            const profilMatricule =
                document.getElementById(
                    'profilMatricule'
                );

            const profilPromotion =
                document.getElementById(
                    'profilPromotion'
                );

            if (profilNom) {

                profilNom.textContent =
                    currentStudent.nom || '';
            }

            if (profilMatricule) {

                profilMatricule.textContent =
                    `Matricule: ${
                        currentStudent.matricule || ''
                    }`;
            }

            if (profilPromotion) {

                profilPromotion.textContent =
                    `Promotion: ${promoNom}`;
            }
        }

        // ================================================================
        // 19. OUVERTURE PROFIL
        // ================================================================

        document
            .getElementById('profileBtn')
            ?.addEventListener(
                'click',
                async () => {

                    try {

                        await loadProfileData();

                        const modal =
                            document.getElementById(
                                'profileModal'
                            );

                        if (modal) {

                            modal.style.display =
                                'flex';
                        }

                    } catch (error) {

                        console.error(
                            '[PROFIL] Erreur:',
                            error
                        );

                        showToast(
                            'Impossible de charger le profil.',
                            'danger'
                        );
                    }

                }
            );

        // ================================================================
        // 20. FERMER PROFIL
        // ================================================================

        window.closeProfileModal =
            () => {

                const modal =
                    document.getElementById(
                        'profileModal'
                    );

                if (modal) {

                    modal.style.display =
                        'none';
                }

                const newPassword =
                    document.getElementById(
                        'newPassword'
                    );

                const confirmPassword =
                    document.getElementById(
                        'confirmNewPassword'
                    );

                if (newPassword) {
                    newPassword.value = '';
                }

                if (confirmPassword) {
                    confirmPassword.value = '';
                }
            };

        // ================================================================
        // 21. FERMER EN CLIQUANT À L'EXTÉRIEUR
        // ================================================================

        document
            .getElementById('profileModal')
            ?.addEventListener(
                'click',
                function(e) {

                    if (e.target === this) {

                        closeProfileModal();
                    }

                }
            );

        // ================================================================
        // 22. CHANGER MOT DE PASSE
        // ================================================================

        document
            .getElementById('changePasswordBtn')
            ?.addEventListener(
                'click',
                async function() {

                    const newPwd =
                        document.getElementById(
                            'newPassword'
                        )?.value || '';

                    const confirmPwd =
                        document.getElementById(
                            'confirmNewPassword'
                        )?.value || '';

                    if (
                        !newPwd ||
                        !confirmPwd
                    ) {

                        showToast(
                            'Remplissez tous les champs',
                            'warning'
                        );

                        return;
                    }

                    if (
                        newPwd !== confirmPwd
                    ) {

                        showToast(
                            'Mots de passe différents',
                            'warning'
                        );

                        return;
                    }

                    if (
                        newPwd.length < 4
                    ) {

                        showToast(
                            'Minimum 4 caractères',
                            'warning'
                        );

                        return;
                    }

                    const btn = this;

                    const texteOriginal =
                        btn.textContent;

                    btn.disabled = true;

                    btn.innerHTML =
                        '<span class="spinner-border spinner-border-sm me-1"></span> Modification...';

                    try {

                        await db
                            .collection('etudiants')
                            .doc(currentStudent.id)
                            .update({

                                motDePasse:
                                    newPwd

                            });

                        showToast(
                            '✅ Mot de passe modifié',
                            'success'
                        );

                        closeProfileModal();

                    } catch (error) {

                        console.error(
                            '[PASSWORD] Erreur:',
                            error
                        );

                        showToast(
                            '❌ Erreur: ' +
                            (
                                error.message ||
                                'Modification impossible'
                            ),
                            'danger'
                        );

                    } finally {

                        btn.disabled = false;

                        btn.textContent =
                            texteOriginal;
                    }

                }
            );

        // ================================================================
        // 23. DÉCONNEXION
        // ================================================================

        document
            .getElementById('logoutBtn')
            ?.addEventListener(
                'click',
                () => {

                    if (
                        !confirm(
                            'Se déconnecter ?'
                        )
                    ) {

                        return;
                    }

                    localStorage.removeItem(
                        'session_etudiant'
                    );

                    localStorage.removeItem(
                        'communiques_lus'
                    );

                    if (unsubscribe) {

                        try {
                            unsubscribe();
                        } catch (e) {}

                        unsubscribe = null;
                    }

                    window.location.href =
                        'login-etudiant.html';
                }
            );

        // ================================================================
        // 24. SERVICE WORKER CENTRALISÉ
        // ================================================================

        async function registerServiceWorker() {

            if (
                typeof window.registerAppServiceWorker ===
                'function'
            ) {

                try {

                    const registration =
                        await window
                            .registerAppServiceWorker();

                    console.log(
                        '✅ SW centralisé:',
                        registration?.scope || 'actif'
                    );

                    return registration;

                } catch (error) {

                    console.error(
                        '❌ Erreur SW centralisé:',
                        error
                    );

                    return null;
                }
            }

            /*
             * Fallback si notification-utils.js
             * n'est momentanément pas chargé.
             */

            if (
                !('serviceWorker' in navigator)
            ) {

                console.warn(
                    '[SW] Service Worker non supporté.'
                );

                return null;
            }

            try {

                const registration =
                    await navigator.serviceWorker
                        .register(
                            './sw.js',
                            {
                                scope:
                                    '/Espace-etudiant/'
                            }
                        );

                console.log(
                    '✅ SW principal:',
                    registration.scope
                );

                return registration;

            } catch (error) {

                console.error(
                    '❌ Erreur enregistrement SW:',
                    error
                );

                return null;
            }
        }

        // ================================================================
        // 25. MODE HORS LIGNE
        // ================================================================

        function setupOfflineDetection() {

            const offlineBadge =
                document.getElementById(
                    'offlineBadge'
                );

            function updateStatus() {

                if (!offlineBadge) {
                    return;
                }

                if (!navigator.onLine) {

                    offlineBadge.classList.add(
                        'show'
                    );

                    updateCacheStatus(
                        'offline'
                    );

                } else {

                    offlineBadge.classList.remove(
                        'show'
                    );

                    /*
                     * Ne pas écraser "Temps réel"
                     * si Firestore est déjà connecté.
                     */

                    if (
                        allCotations.length === 0
                    ) {

                        updateCacheStatus(
                            'live',
                            '🔄 En ligne'
                        );
                    }
                }
            }

            window.addEventListener(
                'online',
                updateStatus
            );

            window.addEventListener(
                'offline',
                updateStatus
            );

            updateStatus();
        }

        // ================================================================
        // 26. INITIALISATION
        // ================================================================

        async function init() {

            if (!checkSession()) {
                return;
            }

            console.log(
                '🚀 Page Notes - Étudiant'
            );

            console.log(
                '👤 Étudiant:',
                currentStudent.nom
            );

            console.log(
                '🆔 ID:',
                currentStudent.id
            );

            /*
             * Enregistrer le Service Worker central.
             */

            await registerServiceWorker();

            /*
             * Initialiser le système de notifications.
             *
             * IMPORTANT :
             * Cette fonction ne force pas la demande
             * de permission. L'étudiant doit cliquer
             * sur "Activer" lorsque nécessaire.
             */

            await initialiserNotifications();

            /*
             * Charger les promotions.
             */

            await chargerPromotions();

            /*
             * Écouter les notes en temps réel.
             */

            setupRealtimeListener();

            /*
             * Gestion hors ligne.
             */

            setupOfflineDetection();

            /*
             * Afficher l'état de permission.
             */

            mettreAJourEtatNotification();

            console.log(
                '✅ Page Mes Notes prête.'
            );
        }

        // ================================================================
        // 27. NETTOYAGE
        // ================================================================

        window.addEventListener(
            'beforeunload',
            () => {

                if (unsubscribe) {

                    try {
                        unsubscribe();
                    } catch (e) {}

                    unsubscribe = null;
                }
            }
        );

        // ================================================================
        // 28. LANCEMENT
        // ================================================================

        init();

    </script>
