    <script>

        // ================================================================
        // 1. SYSTÈME DE CACHE LOCAL AVANCÉ
        // ================================================================

        const CacheManager = {

            PREFIX: 'fsa_cache_',

            TTL: {
                PAIEMENTS: 5 * 60 * 1000,
                ETUDIANTS: 12 * 60 * 60 * 1000,
                PROMOTIONS: 24 * 60 * 60 * 1000,
                ANNEES: 24 * 60 * 60 * 1000
            },

            set(key, data, ttlKey = null) {

                try {

                    const ttl = ttlKey
                        ? this.TTL[ttlKey]
                        : this.TTL.PAIEMENTS;

                    const cacheItem = {
                        data: data,
                        timestamp: Date.now(),
                        expires: Date.now() + ttl
                    };

                    localStorage.setItem(
                        this.PREFIX + key,
                        JSON.stringify(cacheItem)
                    );

                    return true;

                } catch (e) {

                    console.error('Erreur sauvegarde cache:', e);
                    return false;

                }
            },

            get(key) {

                try {

                    const raw = localStorage.getItem(
                        this.PREFIX + key
                    );

                    if (!raw) return null;

                    const cacheItem = JSON.parse(raw);

                    if (
                        !cacheItem ||
                        typeof cacheItem.expires !== 'number'
                    ) {
                        this.remove(key);
                        return null;
                    }

                    if (Date.now() > cacheItem.expires) {

                        this.remove(key);
                        return null;

                    }

                    return cacheItem.data;

                } catch (e) {

                    return null;

                }
            },

            remove(key) {

                try {

                    localStorage.removeItem(
                        this.PREFIX + key
                    );

                } catch (e) {

                    console.error('Erreur suppression cache:', e);

                }

            },

            cleanExpired() {

                try {

                    const keys = Object.keys(localStorage);

                    let count = 0;

                    for (const key of keys) {

                        if (!key.startsWith(this.PREFIX)) {
                            continue;
                        }

                        const raw = localStorage.getItem(key);

                        if (!raw) continue;

                        try {

                            const cacheItem = JSON.parse(raw);

                            if (
                                !cacheItem ||
                                typeof cacheItem.expires !== 'number' ||
                                Date.now() > cacheItem.expires
                            ) {

                                localStorage.removeItem(key);
                                count++;

                            }

                        } catch (e) {

                            localStorage.removeItem(key);
                            count++;

                        }

                    }

                    return count;

                } catch (e) {

                    return 0;

                }

            },

            isValid(key) {

                try {

                    const raw = localStorage.getItem(
                        this.PREFIX + key
                    );

                    if (!raw) return false;

                    const cacheItem = JSON.parse(raw);

                    if (
                        !cacheItem ||
                        typeof cacheItem.expires !== 'number'
                    ) {
                        return false;
                    }

                    return Date.now() <= cacheItem.expires;

                } catch (e) {

                    return false;

                }

            }

        };

        CacheManager.cleanExpired();


        // ================================================================
        // 2. FIREBASE
        // ================================================================

        const firebaseConfig = {

            apiKey: "AIzaSyBbQ2N-5ns7qKjBAj5UvDW87s2PZ27F0",

        const db = firebase.firestore();

        // Firebase Messaging
        let messaging = null;

        try {

            if (

        // ================================================================
        // 3. CHARGEMENT DU GESTIONNAIRE DE NOTIFICATIONS
        // ================================================================

        /*
         * Le fichier notification-utils.js est chargé plus bas.
         *
         * Il centralise :
         * - le Service Worker ;

         * - l'enregistrement du token ;

         */


        // ================================================================
        // 4. VARIABLES
        // ================================================================

        let currentStudent = null;
        let allPromotions = [];
        let allAnnees = [];
        let allTransactions = [];
        let snapshotUnsubscribe = null;


        // ================================================================
        // 5. SESSION
        // ================================================================

        function checkSession() {

            const session =
                localStorage.getItem('session_etudiant');

            if (!session) {

                window.location.href =
                    'login-etudiant.html';

                return false;

            }

            try {

                const sessionData = JSON.parse(session);

                if (
                    !sessionData ||
                    !sessionData.expires ||
                    Date.now() > sessionData.expires
                ) {

                    localStorage.removeItem(
                        'session_etudiant'
                    );

                    window.location.href =
                        'login-etudiant.html';

                    return false;

                }

                if (!sessionData.id) {

                    localStorage.removeItem(
                        'session_etudiant'
                    );

                    window.location.href =
                        'login-etudiant.html';

                    return false;

                }

                currentStudent = sessionData;

                return true;

            } catch (e) {

                console.error(
                    'Session invalide:',
                    e
                );

                localStorage.removeItem(
                    'session_etudiant'
                );

                window.location.href =
                    'login-etudiant.html';

                return false;

            }

        }


        // ================================================================
        // 6. FONCTIONS UTILITAIRES
        // ================================================================

        function showToast(
            message,
            type = 'success'
        ) {

            const container =
                document.getElementById(
                    'toastContainer'
                );

            if (!container) return;

            const colors = {

                success: {
                    bg: '#28a745',
                    icon: 'check-circle-fill'
                },

                warning: {
                    bg: '#ffc107',
                    icon: 'exclamation-triangle-fill',
                    textColor: '#333'
                },

                danger: {
                    bg: '#dc3545',
                    icon: 'x-circle-fill'
                },

                info: {
                    bg: '#17a2b8',
                    icon: 'info-circle-fill'
                }

            };

            const config =
                colors[type] || colors.success;

            const textColor =
                config.textColor || 'white';

            const toastHtml = `
                <div class="toast"
                     style="background:${config.bg};color:${textColor};">
                    <div class="toast-body">
                        <i class="bi bi-${config.icon} me-2"></i>
                        ${escapeHtml(message)}
                    </div>
                </div>
            `;

            container.insertAdjacentHTML(
                'afterbegin',
                toastHtml
            );

            const firstToast =
                container.firstElementChild;

            setTimeout(() => {

                if (firstToast) {
                    firstToast.remove();
                }

            }, 4000);

        }


        function escapeHtml(text) {

            if (
                text === null ||
                text === undefined
            ) {
                return '';
            }

            const div =
                document.createElement('div');

            div.textContent =
                String(text);

            return div.innerHTML;

        }


        function formatDate(date) {

            if (!date) return '-';

            try {

                if (
                    date &&
                    typeof date.toDate === 'function'
                ) {

                    date = date.toDate();

                } else if (
                    date &&
                    typeof date.seconds === 'number'
                ) {

                    date =
                        new Date(
                            date.seconds * 1000
                        );

                } else if (
                    typeof date === 'string' ||
                    typeof date === 'number'
                ) {

                    date = new Date(date);

                }

                if (
                    !(date instanceof Date) ||
                    isNaN(date.getTime())
                ) {

                    return '-';

                }

                return date.toLocaleDateString(
                    'fr-FR',
                    {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    }
                );

            } catch (e) {

                return '-';

            }

        }


        function formatDateTime(date) {

            if (!date) return '-';

            try {

                if (
                    date &&
                    typeof date.toDate === 'function'
                ) {

                    date = date.toDate();

                } else if (
                    date &&
                    typeof date.seconds === 'number'
                ) {

                    date =
                        new Date(
                            date.seconds * 1000
                        );

                } else if (
                    typeof date === 'string' ||
                    typeof date === 'number'
                ) {

                    date = new Date(date);

                }

                if (
                    !(date instanceof Date) ||
                    isNaN(date.getTime())
                ) {

                    return '-';

                }

                return date.toLocaleString(
                    'fr-FR',
                    {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    }
                );

            } catch (e) {

                return '-';

            }

        }


        function getTransactionDateValue(date) {

            try {

                if (!date) return 0;

                if (
                    date &&
                    typeof date.toDate === 'function'
                ) {

                    return date.toDate().getTime();

                }

                if (
                    date &&
                    typeof date.seconds === 'number'
                ) {

                    return date.seconds * 1000;

                }

                if (
                    typeof date === 'string' ||
                    typeof date === 'number'
                ) {

                    const parsed =
                        new Date(date).getTime();

                    return isNaN(parsed)
                        ? 0
                        : parsed;

                }

            } catch (e) {

                return 0;

            }

            return 0;

        }


        function updateCacheStatus(
            status,
            message
        ) {

            const el =
                document.getElementById(
                    'cacheStatusText'
                );

            if (!el) return;

            const statusMap = {

                cached: '📦 Cache',
                live: '🔄 Temps réel',
                offline: '⚠️ Hors ligne',
                error: '❌ Erreur'

            };

            el.textContent =
                message ||
                statusMap[status] ||
                status;

        }


        // ================================================================
        // 7. CHARGEMENT DES PROMOTIONS
        // ================================================================

        async function chargerPromotions(
            forceRefresh = false
        ) {

            const cacheKey =
                'promotions';

            if (!forceRefresh) {

                const cached =
                    CacheManager.get(cacheKey);

                if (
                    cached &&
                    Array.isArray(cached) &&
                    cached.length > 0
                ) {

                    allPromotions = cached;

                    return allPromotions;

                }

            }

            try {

                const snapshot =
                    await db
                        .collection('promotions')
                        .get();

                allPromotions = [];

                snapshot.forEach(doc => {

                    allPromotions.push({
                        id: doc.id,
                        ...doc.data()
                    });

                });

                CacheManager.set(
                    cacheKey,
                    allPromotions,
                    'PROMOTIONS'
                );

                return allPromotions;

            } catch (error) {

                console.error(
                    'Erreur chargement promotions:',
                    error
                );

                const cached =
                    CacheManager.get(cacheKey);

                if (
                    cached &&
                    Array.isArray(cached) &&
                    cached.length > 0
                ) {

                    allPromotions = cached;

                    return allPromotions;

                }

                return [];

            }

        }


        // ================================================================
        // 8. CHARGEMENT DES ANNÉES ACADÉMIQUES
        // ================================================================

        async function chargerAnnees(
            forceRefresh = false
        ) {

            const cacheKey =
                'anneesAcademiques';

            if (!forceRefresh) {

                const cached =
                    CacheManager.get(cacheKey);

                if (
                    cached &&
                    Array.isArray(cached) &&
                    cached.length > 0
                ) {

                    allAnnees = cached;

                    return allAnnees;

                }

            }

            try {

                const snapshot =
                    await db
                        .collection('anneesAcademiques')
                        .get();

                allAnnees = [];

                snapshot.forEach(doc => {

                    allAnnees.push({
                        id: doc.id,
                        ...doc.data()
                    });

                });

                CacheManager.set(
                    cacheKey,
                    allAnnees,
                    'ANNEES'
                );

                return allAnnees;

            } catch (error) {

                console.error(
                    'Erreur chargement années:',
                    error
                );

                const cached =
                    CacheManager.get(cacheKey);

                if (
                    cached &&
                    Array.isArray(cached) &&
                    cached.length > 0
                ) {

                    allAnnees = cached;

                    return allAnnees;

                }

                return [];

            }

        }


        // ================================================================
        // 9. NOMS PROMOTION / ANNÉE
        // ================================================================

        function getPromotionNom(
            promotionId
        ) {

            if (!promotionId) {
                return 'Non définie';
            }

            const promo =
                allPromotions.find(
                    p => p.id === promotionId
                );

            return promo
                ? promo.nom
                : promotionId;

        }


        function getAnneeNom(
            anneeId
        ) {

            if (!anneeId) {
                return '-';
            }

            const annee =
                allAnnees.find(
                    a => a.id === anneeId
                );

            return annee
                ? (
                    annee.annee ||
                    annee.nom ||
                    anneeId
                )
                : anneeId;

        }

        // ================================================================

        function afficherPaiements(
            transactions,
            fromCache = false
        ) {

            const container =
                document.getElementById(
                    'paiementsContainer'
                );

            if (!container) return;

            const promoNom =
                getPromotionNom(
                    currentStudent.promotion
                );

            if (
                !transactions ||
                transactions.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty-state">

                        <i class="bi bi-receipt"></i>

                        <h5>Aucun paiement trouvé</h5>

                        <hr>

                        <small class="text-muted">

                                currentStudent.matricule

                                    </p>
                                `
                                : ''
                        }

            const transactionsParAnnee = {};

                transaction => {

                        Number(
                            transaction.montantTotal ||
                            transaction.montant ||
                            0

                        transaction.isDuplicata
                    ) {

                        montant =
                            Number(
                                transaction.dernierFraisDuplicata ||
                                transaction.duplicataFrais ||
                                montant
                            );

                    }

                    totalGeneral += montant;


                    const anneeId =
                        transaction.anneeAcademiqueId ||
                        transaction.anneeAcademique ||
                        'default';


                    if (
                        !transactionsParAnnee[anneeId]
                    ) {

                        transactionsParAnnee[anneeId] = {

                            total: 0,

                            transactions: []

                        };

                    }


                    transactionsParAnnee[
                        anneeId

                        transaction

                    transactionsParAnnee[
                        anneeId

            let html = `

                        <i class="bi bi-person-badge"></i>

                        <strong>
                            ${escapeHtml(
                                currentStudent.nom

                        Matricule:

                        Promotion:

                            promoNom

                    <hr class="my-2">

                    <small>
                        <i class="bi bi-check-circle"></i>
                        ${transactions.length}
                        paiement(s) trouvé(s)
                    </small>

                </div>

            `;


            const anneeKeys =
                Object.keys(
                    transactionsParAnnee
                );


            for (
                const anneeId of anneeKeys
            ) {

                const data =
                    transactionsParAnnee[
                        anneeId
                    ];

                const anneeNom =
                    getAnneeNom(
                        anneeId
                    );


                html += `

                    <div class="payment-status-card"
                         style="margin-top:20px;">

                        <h6>

                            <i class="bi bi-calendar-week"></i>

                            Année académique :
                            ${escapeHtml(
                                anneeNom

                            <table class="paiements-table">

                                <thead>

                                    <tr>

                                        <th>Date</th>

                                        <th>N° Reçu</th>

                                        <th>Fiches payées</th>

                                        <th>Montant</th>

                                        <th>Statut</th>

                                    </tr>

                                </thead>

                                <tbody>

                `;


                for (
                    const transaction
                    of data.transactions
                ) {

                    const dateTransaction =
                        formatDateTime(
                            transaction.date
                        );


                    let montant =
                        Number(
                            transaction.montantTotal ||
                            transaction.montant ||
                            0
                        );


                    let statut =
                        transaction.statut ||
                        'payé';


                    let typeLabel =
                        'Original';


                    if (
                        transaction.isDuplicata
                    ) {

                        montant =
                            Number(
                                transaction.dernierFraisDuplicata ||
                                transaction.duplicataFrais ||
                                montant
                            );

                        typeLabel =
                            'Duplicata';

                    }


                    let fichesHtml =
                        '';


                    if (
                        Array.isArray(
                            transaction.fiches

                        transaction.fiches.length > 0
                    ) {

                        fichesHtml =
                            transaction.fiches
                                .map(f => {

                                    return `
                                        <span class="fiche-badge">

                                            ${escapeHtml(

                    } else if (

        // ================================================================
        // 12. ÉCOUTEUR TEMPS RÉEL FIRESTORE
        // ================================================================

        function setupRealtimeListener() {

            if (snapshotUnsubscribe) {

                try {

                    snapshotUnsubscribe();

                } catch (e) {

                    console.warn(
                        'Erreur arrêt listener:',
                        e
                    );

                }

                snapshotUnsubscribe =
                    null;

            }


            if (!currentStudent) {
                return;
            }


            const matricule =
                currentStudent.matricule;

            const studentId =
                currentStudent.id;

            const cacheKey =
                'paiements_' +
                studentId;


            // ------------------------------------------------------------
            // AFFICHAGE IMMÉDIAT DEPUIS LE CACHE
            // ------------------------------------------------------------

            const cachedTransactions =
                CacheManager.get(
                    cacheKey
                );


            if (
                cachedTransactions &&
                Array.isArray(cachedTransactions) &&
                cachedTransactions.length > 0
            ) {

                allTransactions =
                    cachedTransactions;

                afficherPaiements(
                    cachedTransactions,
                    true
                );

                console.log(
                    '📦 Paiements affichés depuis le cache'
                );

                updateCacheStatus(
                    'cached',
                    '📦 Cache (' +
                    cachedTransactions.length +
                    ' pay.)'
                );

            }


            // ------------------------------------------------------------
            // FIRESTORE TEMPS RÉEL
            // ------------------------------------------------------------

            snapshotUnsubscribe =
                db.collection('transactions')
                    .limit(2000)
                    .onSnapshot(

                        snapshot => {

                            const transactions =
                                [];

                            let newTransactionsCount =
                                0;


                            snapshot.docChanges()
                                .forEach(
                                    change => {

                                        const data =
                                            change.doc.data();


                                        const estConcerne =
                                            (
                                                data.etudiantId === matricule ||
                                                data.etudiantMatricule === matricule ||
                                                data.etudiantId === studentId
                                            );


                                        if (
                                            estConcerne &&
                                            change.type === 'added'
                                        ) {

                                            newTransactionsCount++;

                                        }

                                    }
                                );


                            snapshot.forEach(
                                doc => {

                                    const data =
                                        doc.data();


                                    const estConcerne =
                                        (
                                            data.etudiantId === matricule ||
                                            data.etudiantMatricule === matricule ||
                                            data.etudiantId === studentId
                                        );


                                    if (
                                        estConcerne
                                    ) {

                                        transactions.push({

                                            id: doc.id,

                                            ...data

                                        });

                                    }

                                }
                            );


                            // ------------------------------------------------
                            // TRI DU PLUS RÉCENT AU PLUS ANCIEN
                            // ------------------------------------------------

                            transactions.sort(
                                (a, b) => {

                                    const dateA =
                                        getTransactionDateValue(
                                            a.date
                                        );

                                    const dateB =
                                        getTransactionDateValue(
                                            b.date
                                        );

                                    return dateB - dateA;

                                }
                            );


                            allTransactions =
                                transactions;


                            // ------------------------------------------------
                            // CACHE
                            // ------------------------------------------------

                            CacheManager.set(
                                cacheKey,
                                transactions,
                                'PAIEMENTS'
                            );


                            // ------------------------------------------------
                            // AFFICHAGE
                            // ------------------------------------------------

                            afficherPaiements(
                                transactions,
                                false
                            );


                            updateCacheStatus(
                                'live',
                                '🔄 Temps réel (' +
                                transactions.length +
                                ' pay.)'
                            );


                            // ------------------------------------------------
                            // NOUVEAU PAIEMENT
                            // ------------------------------------------------

                            if (
                                newTransactionsCount > 0
                            ) {

                                updateNotificationDot(
                                    true
                                );


                                /*
                                 * Le PUSH en arrière-plan est envoyé
                                 * par le serveur / Cloud Function.
                                 *
                                 * Cette page ne déclenche plus elle-même
                                 * un push FCM.
                                 */

                                if (
                                    !document.hasFocus()
                                ) {

                                    const newTransaction =
                                        transactions[0];

                                    const newMontant =
                                        Number(
                                            newTransaction?.montantTotal ||
                                            newTransaction?.montant ||
                                            0
                                        );


                                    showToast(
                                        '💳 Nouveau paiement de ' +
                                        newMontant.toLocaleString('fr-FR') +
                                        ' FC enregistré !',
                                        'success'
                                    );

                                }

                            }

                        },

                        error => {

                            console.error(
                                'Erreur écouteur paiements:',
                                error
                            );


                            updateCacheStatus(
                                'offline',
                                '⚠️ Hors ligne'
                            );


                            // ------------------------------------------------
                            // FALLBACK CACHE
                            // ------------------------------------------------

                            if (
                                allTransactions.length === 0
                            ) {

                                const cached =
                                    CacheManager.get(
                                        cacheKey
                                    );


                                if (
                                    cached &&
                                    Array.isArray(cached) &&
                                    cached.length > 0
                                ) {

                                    allTransactions =
                                        cached;


                                    afficherPaiements(
                                        cached,
                                        true
                                    );


                                    showToast(
                                        'Mode hors ligne - données en cache',
                                        'warning'
                                    );

                                } else {

                                    showToast(
                                        'Impossible de charger les paiements',
                                        'danger'
                                    );

                                }

                            }

                        }

                    );

        }

        // ================================================================
        // 17. SERVICE WORKER CENTRALISÉ
        // ================================================================

        async function registerServiceWorker() {

            try {

                /*
                 * On utilise le gestionnaire centralisé.
                 *
                 * notification-utils.js s'occupe de :
                 * - enregistrer ./sw.js ;
                 * - utiliser le scope /Espace-etudiant/ ;
                 * - supprimer les anciennes registrations inutiles ;
                 * - connecter Firebase Messaging au SW central.
                 */

                if (
                    typeof window.registerAppServiceWorker ===
                    'function'
                ) {

                    return await
                        window.registerAppServiceWorker();

                }


                // --------------------------------------------------------
                // FALLBACK
                // --------------------------------------------------------

                if (
                    !('serviceWorker' in navigator)
                ) {

                    console.warn(
                        'Service Worker non supporté'
                    );

                    return null;

                }


                const registration =
                    await navigator.serviceWorker.register(
                        './sw.js',
                        {
                            scope: '/Espace-etudiant/'
                        }
                    );


                console.log(
                    '✅ Service Worker enregistré:',
                    registration.scope
                );


                return registration;


            } catch (error) {

                console.error(
                    'Erreur Service Worker:',
                    error
                );

                return null;

            }

        }

        // ================================================================

        async function init() {

            if (!checkSession()) {
                return;
            }


            console.log(
                '🚀 Initialisation page paiements v3'
            );


            console.log(
                '👤 Étudiant:',
                currentStudent.nom
            );


            console.log(
                '📦 Cache local activé'
            );


            CacheManager.cleanExpired();


            // ------------------------------------------------------------
            // RÉFÉRENTIELS
            // ------------------------------------------------------------

            await Promise.allSettled([

                chargerPromotions(),

                chargerAnnees()

            ]);


            // ------------------------------------------------------------
            // SERVICE WORKER CENTRAL
            // ------------------------------------------------------------

            await registerServiceWorker();


            // ------------------------------------------------------------
            // NOTIFICATIONS
            // ------------------------------------------------------------

            await initialiserNotifications();


            // ------------------------------------------------------------
            // PAIEMENTS TEMPS RÉEL
            // ------------------------------------------------------------

            setupRealtimeListener();


            console.log(
                '✅ Paiements prêt - Cache + Temps réel + Notifications actifs'
            );

        }


        // ================================================================
        // 23. LANCEMENT
        // ================================================================

        init().catch(
            error => {

                console.error(
                    'Erreur initialisation:',
                    error
                );


                showToast(
                    'Erreur de chargement',
                    'danger'
                );

            }
        );


        // ================================================================
        // 24. CONSOLE DE DÉBOGAGE
        // ================================================================

        console.log(
            '%c💳 PAIEMENTS - CACHE ACTIVÉ',
            'color:#ffb347;font-size:12px;font-weight:bold;'
        );

        console.log(
            '%c📦 Affichage instantané depuis le cache',
            'color:#28a745;font-size:11px;'
        );

        console.log(
            '%c🔔 Système de notifications centralisé',
            'color:#003366;font-size:11px;font-weight:bold;'
        );

    </script>
