<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Horaires - Étudiant</title>
    <meta name="theme-color" content="#003366">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <link rel="icon" type="image/png" href="icon-96x96.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FAC Agro">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary-blue: #003366; --dark-blue: #002244; --accent-yellow: #ffb347; --light-gray: #f0f2f5; }
        
        body { background: var(--light-gray); font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 20px; }
        
        .navbar-custom { background: var(--primary-blue); box-shadow: 0 4px 15px rgba(0,0,0,0.2); padding: 12px 0; }
        .navbar-brand { font-weight: bold; font-size: 1rem; }
        
        .back-btn {
            background: var(--accent-yellow); color: var(--primary-blue);
            border: none; padding: 8px 20px; border-radius: 25px;
            font-weight: bold; transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
        }
        .back-btn:hover { background: #ff9800; transform: translateY(-2px); color: var(--primary-blue); }
        
        .navbar-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        
        .profile-photo {
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--accent-yellow); display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative;
        }
        .profile-photo i { font-size: 28px; color: var(--primary-blue); }
        
        .content-card {
            background: white; border-radius: 20px; padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 30px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
            padding-bottom: 15px; border-bottom: 2px solid #f0f0f0;
        }
        .section-header h4 { color: var(--primary-blue); margin: 0; font-weight: bold; }
        
        .info-promo {
            background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue));
            color: white; border-radius: 15px; padding: 15px 20px; margin-bottom: 25px;
            display: flex; align-items: center; gap: 15px;
        }
        .info-promo i { font-size: 30px; color: var(--accent-yellow); }
        
        .sync-badge { background: #28a745; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
        
        .semaine-nav {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 25px; flex-wrap: wrap;
        }
        .semaine-nav select {
            border-radius: 10px; padding: 10px 15px;
            border: 2px solid var(--primary-blue);
            font-weight: 600; color: var(--primary-blue);
            background: #f8f9fa; cursor: pointer; font-size: 15px;
        }
        .semaine-badge-status {
            padding: 5px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 500;
        }
        .semaine-badge-status.active { background: #d4edda; color: #155724; }
        .semaine-badge-status.passee { background: #fff3cd; color: #856404; }
        .semaine-badge-status.future { background: #cce5ff; color: #004085; }
        
        .semaine-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }
        
        .jour-colonne {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 12px;
            min-height: 180px;
        }
        
        .jour-titre {
            background: var(--primary-blue);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 12px;
        }
        
        .horaire-item {
            background: white;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 6px;
            border-left: 3px solid var(--accent-yellow);
            font-size: 11px;
            transition: all 0.3s;
        }
        .horaire-item:hover { transform: translateX(3px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .horaire-heure { font-weight: bold; color: var(--primary-blue); font-size: 12px; }
        .horaire-cours { font-weight: 600; color: #333; }
        .horaire-prof { color: #666; font-size: 10px; }
        .horaire-salle { color: #888; font-size: 10px; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #888; }
        .empty-state i { font-size: 70px; color: #ccc; margin-bottom: 20px; }
        
        .toast-notification { position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 300px; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast { animation: slideInRight 0.3s ease-out; }
        
        .footer-info { text-align: center; margin-top: auto; padding: 20px 0; border-top: 1px solid #e0e0e0; font-size: 11px; color: #888; }
        .footer-info img { border-radius: 20px; vertical-align: middle; }
        
        @media (max-width: 992px) { .semaine-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 576px) { .semaine-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <nav class="navbar navbar-custom">
        <div class="container">
            <a class="navbar-brand text-white" href="#"><i class="bi bi-tree-fill"></i> FACULTÉ AGRONOMIQUE - UNILU</a>
            <div class="navbar-right">
                <div class="profile-photo" id="profileBtn"><i class="bi bi-person-circle"></i></div>
                <a href="etudiant.html" class="back-btn"><i class="bi bi-house-door-fill"></i> Accueil</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4" style="flex: 1;">
        <div id="toastContainer" class="toast-notification"></div>
        
        <div class="content-card">
            <div class="section-header">
                <h4><i class="bi bi-calendar-week"></i> Mon Emploi du Temps</h4>
                <span class="sync-badge"><i class="bi bi-circle-fill" style="font-size:8px;"></i> Temps réel</span>
            </div>
            
            <!-- Info promotion -->
            <div class="info-promo">
                <i class="bi bi-trophy-fill"></i>
                <div>
                    <strong id="promoName">Chargement...</strong>
                    <br><small id="studentInfo" style="opacity:0.9;"></small>
                </div>
            </div>
            
            <!-- Navigation semaine -->
            <div class="semaine-nav">
                <label><i class="bi bi-calendar-range"></i> <strong>Semaine :</strong></label>
                <select id="semaineSelect">
                    <option value="">Chargement...</option>
                </select>
                <span id="semaineStatus"></span>
            </div>
            
            <!-- Grille -->
            <div class="semaine-grid" id="semaineGrid"></div>
        </div>
    </div>
    
    <div class="container">
        <div class="footer-info">
            <i class="bi bi-shield-check"></i> HYBRILINK-TECH - Votre partenaire digital<br>
            <img src="t.png" width="40px" alt="HYBRILINK" onerror="this.style.display='none'">
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBb82N2-5ns7qKjQBAj5UvDW87s2PZ27F0",
            authDomain: "fsa-unilu.firebaseapp.com",
            projectId: "fsa-unilu",
            storageBucket: "fsa-unilu.firebasestorage.app",
            messagingSenderId: "36551990738",
            appId: "1:36551990738:web:e91fdcb53f8aab5d1b7c0b"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
        
        let currentStudent = null;
        let allHoraires = [];
        let allPromotions = [];
        let selectedSemaineId = '';
        let unsubscribe = null;
        
        // Génération semaines
        function getLundiDate(date, decalage = 0) {
            const d = new Date(date);
            d.setDate(d.getDate() + (decalage * 7));
            const jour = d.getDay();
            const diff = d.getDate() - jour + (jour === 0 ? -6 : 1);
            const lundi = new Date(d.setDate(diff));
            lundi.setHours(0,0,0,0);
            return lundi;
        }
        
        function genererSemaines() {
            const semaines = [];
            const maintenant = new Date();
            for (let i = 0; i <= 2; i++) {
                const debut = getLundiDate(maintenant, i);
                const fin = new Date(debut);
                fin.setDate(fin.getDate() + 5);
                const debutStr = debut.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' });
                const finStr = fin.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
                semaines.push({
                    id: `S${debut.getFullYear()}-${String(debut.getMonth()+1).padStart(2,'0')}-${String(debut.getDate()).padStart(2,'0')}`,
                    debut, fin,
                    label: `Semaine du ${debutStr} au ${finStr}`,
                    debutISO: debut.toISOString().split('T')[0]
                });
            }
            return semaines;
        }
        
        const semainesDisponibles = genererSemaines();
        
        // Session
        (function() {
            const s = localStorage.getItem('session_etudiant');
            if (!s) { window.location.href = 'login-etudiant.html'; return; }
            try {
                const d = JSON.parse(s);
                if (Date.now() > d.expires) { localStorage.removeItem('session_etudiant'); window.location.href = 'login-etudiant.html'; return; }
                currentStudent = d;
                document.getElementById('studentInfo').textContent = `Matricule: ${d.matricule || 'N/A'} | ${d.nom || 'Étudiant'}`;
                init();
            } catch(e) { localStorage.removeItem('session_etudiant'); window.location.href = 'login-etudiant.html'; }
        })();
        
        async function init() {
            // Charger promotions
            const snapP = await db.collection('promotions').get();
            allPromotions = [];
            snapP.forEach(d => allPromotions.push({ id: d.id, ...d.data() }));
            
            const promo = allPromotions.find(p => p.id === currentStudent.promotion);
            document.getElementById('promoName').textContent = promo ? promo.nom : 'Promotion inconnue';
            
            // Init select semaine
            const sel = document.getElementById('semaineSelect');
            sel.innerHTML = '';
            semainesDisponibles.forEach((s, i) => {
                sel.innerHTML += `<option value="${s.id}">${i===0?'📍 ':''}${s.label}</option>`;
            });
            
            if (semainesDisponibles.length > 0) {
                sel.value = semainesDisponibles[0].id;
                selectedSemaineId = semainesDisponibles[0].id;
                updateSemaineStatus();
            }
            
            sel.addEventListener('change', function() {
                selectedSemaineId = this.value;
                updateSemaineStatus();
                afficherGrille();
            });
            
            // Écouteur temps réel
            unsubscribe = db.collection('horaires')
                .where('promotionId', '==', currentStudent.promotion)
                .onSnapshot(snap => {
                    allHoraires = [];
                    snap.forEach(d => allHoraires.push({ id: d.id, ...d.data() }));
                    afficherGrille();
                }, err => console.error(err));
        }
        
        function updateSemaineStatus() {
            const statusEl = document.getElementById('semaineStatus');
            const semaine = semainesDisponibles.find(s => s.id === selectedSemaineId);
            if (!semaine) return;
            
            const maintenant = new Date();
            if (maintenant > semaine.fin) {
                statusEl.innerHTML = '<span class="semaine-badge-status passee">Semaine passée</span>';
            } else if (maintenant >= semaine.debut && maintenant <= semaine.fin) {
                statusEl.innerHTML = '<span class="semaine-badge-status active">Semaine en cours</span>';
            } else {
                statusEl.innerHTML = '<span class="semaine-badge-status future">Semaine à venir</span>';
            }
        }
        
        function afficherGrille() {
            const grid = document.getElementById('semaineGrid');
            const jours = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
            
            const horairesSemaine = allHoraires.filter(h => h.semaineId === selectedSemaineId);
            
            let html = '';
            jours.forEach(jour => {
                const horairesDuJour = horairesSemaine
                    .filter(h => h.jour === jour)
                    .sort((a, b) => (a.debut || '').localeCompare(b.debut || ''));
                
                html += `<div class="jour-colonne">
                    <div class="jour-titre">${jour}</div>`;
                
                if (horairesDuJour.length === 0) {
                    html += `<div style="text-align:center;padding:15px;color:#ccc;">
                        <i class="bi bi-dash-circle" style="font-size:20px;"></i>
                        <p style="font-size:10px;">Libre</p>
                    </div>`;
                } else {
                    horairesDuJour.forEach(h => {
                        html += `
                        <div class="horaire-item">
                            <div class="horaire-heure"><i class="bi bi-clock"></i> ${h.debut} - ${h.fin}</div>
                            <div class="horaire-cours">${h.coursNom || 'Cours'}</div>
                            <div class="horaire-prof"><i class="bi bi-person"></i> ${h.professeurNom || ''}</div>
                            <div class="horaire-salle"><i class="bi bi-geo-alt"></i> ${h.salle || 'N/A'}</div>
                        </div>`;
                    });
                }
                html += `</div>`;
            });
            
            grid.innerHTML = html;
        }
        
        window.addEventListener('beforeunload', () => { if(unsubscribe) unsubscribe(); });
    </script>
</body>
</html>
